<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Code Prévention</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concept : un code de la route de la prévention. Panneaux ISO (rond bleu, triangle jaune, carré vert) comme repères de chaque module. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#12202B; --muted:#55656F; --line:#D2D9DE;
  --green:#0B7A4B; --green-ink:#FFFFFF; --green-soft:#DDF1E7;
  --blue:#1B5FA8; --red:#C62828; --red-soft:#FBE4E4; --yellow:#F2B705;
  --sign-white:#FFFFFF; --sign-dark:#14191D;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C; --surface:#15202A; --surface-2:#1B2833; --ink:#E8EEF2; --muted:#9AAAB6; --line:#27394A;
    --green:#3FBF88; --green-ink:#06231A; --green-soft:#12332A;
    --blue:#5E9FE3; --red:#F07070; --red-soft:#3A1C1F; --yellow:#F5C842;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#15202A; --surface-2:#1B2833; --ink:#E8EEF2; --muted:#9AAAB6; --line:#27394A;
  --green:#3FBF88; --green-ink:#06231A; --green-soft:#12332A;
  --blue:#5E9FE3; --red:#F07070; --red-soft:#3A1C1F; --yellow:#F5C842;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--text); font-size:17px; line-height:1.5;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:880px; margin:0 auto}
h1,h2,h3{font-family:var(--display); line-height:1.08; margin:0; text-wrap:balance; letter-spacing:.005em}
h1{font-size:clamp(34px,7vw,52px); font-weight:700; text-transform:uppercase}
h2{font-size:25px; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.top{display:flex; align-items:center; gap:12px; padding:18px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px}
.brand{font-family:var(--display); font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:.04em; background:none; border:0; padding:0; display:flex; align-items:center; gap:10px}
.brand small{font-family:var(--text); font-weight:500; text-transform:none; letter-spacing:0; color:var(--muted); font-size:14px}

/* signes */
.s-blue{fill:var(--blue)} .s-red{fill:var(--red)} .s-green{fill:var(--green)} .s-yellow{fill:var(--yellow)}
.s-edge{stroke:var(--sign-dark); stroke-width:3}
.s-ban{fill:var(--sign-white); stroke:var(--red); stroke-width:5}
.ban-line{stroke:var(--red); stroke-width:5; stroke-linecap:round; fill:none}
.g-light{fill:#fff} .g-dark{fill:var(--sign-dark)}
svg.sign{display:block; flex:none}

.eyebrow{font-family:var(--display); font-weight:600; text-transform:uppercase; letter-spacing:.12em; font-size:14px; color:var(--muted)}
.lead{color:var(--muted); font-size:18px; max-width:60ch}

.hero{display:grid; gap:14px; margin-bottom:22px}
.signs{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.signs .mini{opacity:.28; filter:grayscale(1)}
.signs .mini.on{opacity:1; filter:none}
.progress-line{font-size:15px; color:var(--muted)}
.progress-line b{color:var(--ink)}

.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); margin-bottom:26px}
.mod{display:flex; align-items:center; gap:14px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; width:100%}
.mod:hover{border-color:var(--ink)}
.mod-body{display:grid; gap:2px; min-width:0; flex:1}
.mod-body b{font-family:var(--display); font-size:21px; font-weight:600; line-height:1.15}
.mod-body small{color:var(--muted); font-size:14px}
.tag{font-size:13px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); white-space:nowrap}
.tag.ok{background:var(--green-soft); border-color:transparent; color:var(--green)}

.exam{background:var(--surface); border:2px solid var(--ink); border-radius:10px; padding:20px; display:grid; gap:12px}
.exam h2{font-size:30px; text-transform:uppercase}
.facts{display:flex; flex-wrap:wrap; gap:8px 18px; font-family:var(--display); font-size:20px; font-weight:600}
.facts span{white-space:nowrap}
.note{font-size:14px; color:var(--muted)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:8px; border:2px solid var(--green); background:var(--green); color:var(--green-ink); font-weight:600; font-size:17px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
.back{background:none; border:0; padding:6px 0; color:var(--muted); font-weight:500; margin-bottom:10px}
.back:hover{color:var(--ink)}

/* module */
.mhead{display:flex; gap:16px; align-items:center; margin-bottom:22px}
.mhead>div{min-width:0}
.block{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:12px; display:grid; gap:8px}
.block ul{margin:0; padding-left:20px; display:grid; gap:6px}
.block li::marker{color:var(--muted)}
.keep{background:var(--green-soft); border-radius:10px; padding:18px; margin:18px 0 6px}
.keep h2{color:var(--green); margin-bottom:8px}
.keep ul{margin:0; padding-left:20px; display:grid; gap:6px}
.demo{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:12px}
.demo figure{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 8px; display:grid; justify-items:center; gap:8px; text-align:center}
.demo figcaption{font-family:var(--display); font-size:18px; font-weight:600; line-height:1.1}
.demo figcaption small{display:block; font-family:var(--text); font-weight:400; font-size:13px; color:var(--muted)}

/* quiz */
.qtop{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px}
.bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:22px}
.bar i{display:block; height:100%; background:var(--green)}
.qtext{font-family:var(--text); font-size:22px; font-weight:600; line-height:1.3; margin-bottom:18px; max-width:46ch}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:10px; padding:13px 14px; width:100%; min-width:0}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .l{font-family:var(--display); font-weight:700; font-size:18px; width:26px; height:26px; border-radius:6px; background:var(--surface-2); display:grid; place-items:center; flex:none}
.opt .t{flex:1; min-width:0}
.opt.sel{border-color:var(--blue)}
.opt.sel .l{background:var(--blue); color:#fff}
.opt.good{border-color:var(--green); background:var(--green-soft)}
.opt.bad{border-color:var(--red); background:var(--red-soft)}
.opt .flag{font-size:13px; font-weight:600}
.opt.good .flag{color:var(--green)} .opt.bad .flag{color:var(--red)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px; padding:14px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.explain b{font-family:var(--display); font-size:19px; font-weight:600; display:block; margin-bottom:2px}
.quit{background:none; border:0; color:var(--muted); font-weight:500; padding:6px 0}
.quit:hover{color:var(--ink)}
.confirm{background:var(--red-soft); border-radius:10px; padding:14px; margin-bottom:16px; display:grid; gap:10px}

/* resultat */
.score{display:flex; align-items:baseline; gap:10px; margin:6px 0 4px}
.score b{font-family:var(--display); font-size:84px; font-weight:700; line-height:1}
.score span{font-family:var(--display); font-size:32px; color:var(--muted); font-weight:600}
.verdict{display:inline-block; font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:18px; padding:4px 12px; border-radius:6px; color:#fff}
.verdict.ok{background:var(--green); color:var(--green-ink)} .verdict.ko{background:var(--red); color:#fff}
.bymod{display:grid; gap:8px; margin:20px 0}
.bymod div{display:grid; grid-template-columns:minmax(0,1fr) 54px; gap:4px 12px; align-items:center; font-size:15px}
.bymod .meter{grid-column:1/-1; height:6px; background:var(--line); border-radius:99px; overflow:hidden}
.bymod .meter i{display:block; height:100%; background:var(--green)}
.bymod .meter i.low{background:var(--red)}
.bymod strong{text-align:right; font-variant-numeric:tabular-nums}
.review{display:grid; gap:10px; margin-top:12px}
.rev{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:6px; font-size:16px}
.rev .q{font-weight:600}
.rev .no{color:var(--red)} .rev .yes{color:var(--green)}

/* badge */
.form{display:grid; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; max-width:680px}
.field{display:grid; gap:5px}
.field label{font-weight:600; font-size:15px}
.secset{border:0; padding:0; margin:0; min-width:0}
.secset legend{font-weight:600; font-size:15px; padding:0; margin-bottom:8px}
.secgrid{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.sec{position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border:2px solid var(--line); border-radius:10px; background:var(--surface-2); cursor:pointer; min-width:0}
.sec input{position:absolute; opacity:0; pointer-events:none}
.sec span{font-weight:500; line-height:1.2; min-width:0}
.sec:hover{border-color:var(--ink)}
.sec:has(input:checked){border-color:var(--green); background:var(--green-soft)}
.sec:has(input:focus-visible){outline:3px solid var(--blue); outline-offset:2px}
fieldset[disabled] .sec{opacity:.6; cursor:default}
.field input,.field select{font:inherit; padding:11px 12px; border:2px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); min-height:48px; width:100%}
.field input:focus,.field select:focus{border-color:var(--blue); outline:none}
.badge-stage{display:grid; justify-items:start; gap:16px}
canvas.badge{width:100%; max-width:420px; height:auto; border-radius:14px; display:block}
.dlnote{font-size:14px; color:var(--muted); max-width:46ch}
.callout{background:var(--surface); border:2px solid var(--yellow); border-radius:10px; padding:14px 16px; max-width:62ch}
.callout b{font-family:var(--display); font-size:20px; text-transform:uppercase; letter-spacing:.03em; display:block}
.by{font-family:var(--display); font-weight:600; font-size:18px; color:var(--muted); letter-spacing:.03em}
.profile{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:22px}
.profile>div{min-width:0}
.pname{font-family:var(--display); font-size:26px; font-weight:700; line-height:1.1}
.pschool{color:var(--muted)}
.profile-form{margin-bottom:24px; display:grid; gap:10px}
.tabs{display:flex; gap:6px; margin:-8px 0 20px; border-bottom:1px solid var(--line)}
.tabs button{background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; padding:10px 14px; font-family:var(--display); font-weight:600; font-size:20px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--green)}
.stats{display:flex; flex-wrap:wrap; gap:10px 32px; margin:10px 0 18px}
.stat b{font-family:var(--display); font-size:46px; font-weight:700; line-height:1; display:block; font-variant-numeric:tabular-nums}
.stat span{color:var(--muted); font-size:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; display:grid; gap:10px; max-width:100%}
.panel textarea{font:inherit; font-size:15px; padding:10px 12px; border:2px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); width:100%; min-height:84px; resize:vertical}
.panel textarea:focus{border-color:var(--blue); outline:none}
.filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
.filters input,.filters select{font:inherit; padding:9px 12px; border:2px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); min-height:44px; min-width:0; flex:1 1 200px}
.filters input:focus,.filters select:focus{border-color:var(--blue); outline:none}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:860px; font-size:15px}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--display); font-size:16px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
.chk{font-weight:600; font-size:13px; padding:2px 8px; border-radius:99px}
.chk.ok{background:var(--green-soft); color:var(--green)}
.chk.ko{background:var(--red-soft); color:var(--red)}
.rowdel{background:none; border:0; color:var(--muted); padding:4px 8px; border-radius:6px}
.rowdel:hover{color:var(--red)}
.empty{padding:22px 16px; color:var(--muted)}
.frise{list-style:none; margin:6px 0 0; padding:0; display:flex}
.frise .st{flex:1; display:grid; justify-items:center; align-content:start; gap:2px; text-align:center; position:relative; min-width:0; padding:0 2px}
.frise .st::before{content:""; position:absolute; top:18px; left:-50%; width:100%; height:4px; background:var(--line)}
.frise .st:first-child::before{display:none}
.frise .st.done::before,.frise .st.cur::before{background:var(--green)}
.frise .dot{position:relative; z-index:1; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:21px; background:var(--surface); border:3px solid var(--line); color:var(--muted)}
.frise .done .dot{background:var(--green); border-color:var(--green); color:var(--green-ink)}
.frise .cur .dot{border-color:var(--green); color:var(--ink); box-shadow:0 0 0 5px var(--green-soft)}
.frise b{font-family:var(--display); font-size:17px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; margin-top:6px; color:var(--muted); max-width:100%; overflow-wrap:anywhere}
@media (max-width:480px){.frise b{font-size:14px; letter-spacing:0}.frise small{font-size:12px}}
.frise .done b,.frise .cur b{color:var(--ink)}
.frise small{font-size:13px; color:var(--muted); line-height:1.25}
.frise .here{font-style:normal; font-size:12px; font-weight:600; color:var(--green)}
.cheer{background:var(--green-soft); border-radius:10px; padding:14px 16px; max-width:62ch}
.cheer b{font-family:var(--display); font-size:24px; font-weight:700; color:var(--green); display:block; line-height:1.1; margin-bottom:3px}
.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); font-size:14px; color:var(--muted); max-width:70ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Retour à l'accueil">
      <span id="logo"></span>
      <span>Code Prévention <small>Santé et sécurité en stage</small></span>
    </button>
  </header>
  <nav class="tabs" aria-label="Sections"><button type="button" data-tab="home">Formation</button><button type="button" data-tab="recap">Récapitulatif</button></nav>
  <main id="app" aria-live="polite"></main>
  <p class="foot"><b>Outil réalisé par la DAFPIC.</b> Contenu pédagogique d'initiation. Il complète sans la remplacer la présentation des risques que l'entreprise d'accueil doit vous faire sur votre poste. Vérifiez les numéros d'urgence et les règles applicables sur votre territoire.</p>
</div>

function sign(c,size){
  size=size||48;
  var body, gcls='g-light', tr='translate(12 12)';
  if(c.shape==='circle'){ body='<circle class="s-'+c.col+'" cx="24" cy="24" r="23"/>'; }
  else if(c.shape==='square'){ body='<rect class="s-'+c.col+'" x="2" y="2" width="44" height="44" rx="5"/>'; }
  else if(c.shape==='tri'){ body='<path class="s-yellow s-edge" d="M24 4L45 41H3Z" stroke-linejoin="round"/>'; gcls='g-dark'; tr='translate(14.4 18.4) scale(.8)'; }
  else { body='<circle class="s-ban" cx="24" cy="24" r="21"/><path class="ban-line" d="M9.5 38.5L38.5 9.5"/>'; }
  var g=c.g?'<g class="'+gcls+'" transform="'+tr+'">'+GLYPH[c.g]+'</g>':'';
  return '<svg class="sign" viewBox="0 0 48 48" width="'+size+'" height="'+size+'" aria-hidden="true">'+body+g+'</svg>';
}

[`Pour débrancher une batterie, vous commencez par :`,`La borne négative`,`La borne positive`,`Les deux en même temps`,`Peu importe`,`Débrancher le négatif d'abord évite un court-circuit avec la carrosserie.`],
[`On vous demande d'intervenir sur un véhicule électrique. Que faites-vous ?`,`Je vérifie que l'intervenant est habilité et je n'agis pas sans autorisation`,`Je débranche le premier câble orange que je vois`,`Je fais comme sur un véhicule thermique`,`Je commence seul pour gagner du temps`,`La haute tension de ces véhicules peut tuer. L'habilitation est indispensable.`],
[`Où se jette une huile moteur usagée ?`,`Dans un bac de récupération prévu`,`Dans l'évier`,`Dans la terre derrière l'atelier`,`Dans la poubelle ordinaire`,`Une huile usagée pollue l'eau et les sols. Elle suit une filière spécifique.`],
[`L'air comprimé peut être dirigé vers :`,`Uniquement la pièce à nettoyer, jamais vers une personne`,`Un collègue pour le dépoussiérer`,`Mes vêtements pour les nettoyer`,`Mon visage pour le rafraîchir`,`L'air comprimé peut perforer la peau ou blesser les yeux.`],
[`Avant d'utiliser une meuleuse, vous portez :`,`Lunettes ou visière, gants adaptés et protections auditives si besoin`,`Rien, si le travail est court`,`Des lunettes de soleil`,`Des gants en tissu fin`,`Étincelles et éclats atteignent très vite les yeux et les mains.`],
[`Vous utilisez un solvant dégraissant. Que faites-vous ?`,`Je lis l'étiquette, je porte des gants et j'aère`,`Je le sens pour vérifier`,`Je nettoie mes mains avec`,`Je le transvase dans une bouteille d'eau`,`Les solvants irritent la peau et dégagent des vapeurs nocives.`],
[`Vous travaillez près d'un réservoir d'essence. Quelle règle respectez-vous ?`,`Aucune flamme ni cigarette, et j'aère`,`Je peux fumer à deux mètres`,`Je peux utiliser une meuleuse tout près`,`Je ferme l'atelier pour garder la chaleur`,`Les vapeurs d'essence s'enflamment avec une étincelle.`]
]},
{id:'batiment',name:`Bâtiment & bois`,g:'house',
jobs:`Maçon, organisation et réalisation du gros œuvre, charpentier bois, menuisier fabricant, technicien menuisier agenceur, technicien constructeur bois, peintre applicateur, monteur en installations sanitaires, ouvrages du bâtiment métallerie, technicien d'études du bâtiment`,
lead:`Chantier ou atelier : hauteur, charges, machines et poussières. Les protections collectives passent avant tout.`,
lesson:[

{h:`Équipements de chantier`,ul:[`Casque, chaussures de sécurité, gants, lunettes`,`Protections auditives et masque anti-poussières selon la tâche`,`Gilet haute visibilité dans les zones d'engins`]},
{h:`Machines à bois et à métal`,ul:[`Ne retirez jamais un carter ou une protection`,`Arrêt complet de la machine avant tout réglage ou nettoyage`,`Poussières de bois : aspiration et masque, cheveux attachés`]},
{h:`Poussières et produits`,ul:[`Découpe de béton, carrelage ou briques : à l'eau ou avec aspiration, masque adapté`,`Peintures, colles, solvants : aérer, étiquette, gants`,`Matériaux anciens suspects (plaques ondulées, flocages) : ne percez pas, ne cassez pas, signalez`]},

],
key:[`Casque et chaussures de sécurité sur chantier.`,`Garde-corps avant tout travail en hauteur.`,`Jamais sous une charge levée.`,`Protections de machine toujours en place.`],
qs:[
[`Sur un chantier, quel équipement porte-t-on toujours ?`,`Casque et chaussures de sécurité`,`Casquette et baskets`,`Lunettes de soleil seulement`,`Rien, si l'on reste au sol`,`Chutes d'objets et clous au sol sont des dangers permanents.`],
[`Un échafaudage n'a pas de garde-corps. Que faites-vous ?`,`Je ne monte pas et je le signale`,`Je monte en faisant attention`,`Je monte avec un collègue`,`Je tiens la barre de l'échafaudage`,`Sans garde-corps, la chute est possible. Le montage doit être conforme.`],
[`Sur une échelle, vous devez :`,`Garder trois points d'appui`,`Tenir un outil dans chaque main`,`Me pencher pour atteindre plus loin`,`Travailler plusieurs heures dessus`,`Trois points d'appui limitent la chute.`],
[`Vous coupez du béton à la disqueuse. Pour limiter les poussières, vous :`,`Coupez à l'eau ou avec aspiration et portez un masque adapté`,`Coupez à sec sans protection`,`Soufflez sur la poussière`,`Retirez le masque pour mieux respirer`,`La silice des poussières de béton abîme durablement les poumons.`],
[`Vous trouvez des plaques anciennes en fibro-ciment. Que faites-vous ?`,`Je n'y touche pas et je préviens mon tuteur`,`Je les perce pour vérifier`,`Je les casse pour les jeter`,`Je les ponce`,`Certains matériaux anciens contiennent de l'amiante. Ne pas les abîmer.`],
[`Le carter d'une scie circulaire vous gêne. Que faites-vous ?`,`Je le laisse en place et je demande de l'aide`,`Je le retire`,`Je le bloque en position ouverte`,`Je le remplace par du ruban adhésif`,`Un carter retiré expose directement la lame.`],
[`Une charge est suspendue à une grue. Où vous placez-vous ?`,`Jamais sous la charge`,`Juste dessous pour guider`,`Dessous si elle est légère`,`Dessous, avec un casque`,`Une charge qui tombe tue même si le casque protège la tête.`],
[`Il fait très chaud sur le chantier. Que faites-vous ?`,`Je bois régulièrement, je me protège du soleil et je fais des pauses à l'ombre`,`J'attends d'avoir soif pour boire`,`Je retire casque et chemise`,`Je travaille plus vite pour finir tôt`,`La déshydratation et le coup de chaleur arrivent vite.`],
[`Une rallonge électrique a sa gaine abîmée. Que faites-vous ?`,`Je ne l'utilise pas et je la signale`,`Je l'utilise en évitant la zone abîmée`,`Je répare avec du ruban adhésif`,`Je la laisse au sol pour qu'on la voie`,`Câble abîmé et humidité peuvent provoquer une électrisation.`],
[`Une tranchée est creusée sans blindage ni étais. Que faites-vous ?`,`Je n'y descends pas et je préviens mon responsable`,`Je descends rapidement pour travailler`,`Je descends avec un collègue en surveillance`,`Je me tiens au bord pour voir`,`Un éboulement peut ensevelir en quelques secondes.`]
]},
{id:'services',name:`Services à la personne`,g:'heart',

lead:`Au contact d'enfants, de personnes âgées ou fragiles : gestes de manutention, hygiène et vigilance sont essentiels.`,
lesson:[

{h:`Hygiène et risque infectieux`,ul:[`Lavez-vous les mains ou utilisez une solution hydroalcoolique avant et après chaque soin`,`Gants à usage unique, changés entre deux personnes`,`Objets piquants et coupants : dans un collecteur, sans recapuchonner`,`Exposition à du sang : laver à l'eau et au savon, rincer, désinfecter et consulter rapidement`]},
{h:`Enfants`,ul:[`Ne laissez jamais un enfant seul, surtout sur une table à langer, près de l'eau ou en escalier`,`Rangez hors de portée produits, médicaments et petits objets`,`Vérifiez la sécurité des jeux et du matériel`]},
{h:`Produits et médicaments`,ul:[`Ne donnez jamais de médicament sans autorisation et sans prescription`,`Ne mélangez pas les produits d'entretien`]},
{h:`Violence, fatigue et discrétion`,ul:[`Face à un comportement agressif : restez calme, protégez-vous et alertez, ne restez pas seul`,`Parlez de votre fatigue ou d'une situation difficile à votre tuteur`,`Respectez le secret : ce que vous apprenez sur une personne reste confidentiel`]}
],
key:[`Aides techniques pour déplacer, jamais seul.`,`Lavage des mains avant et après chaque soin.`,`Un enfant ne reste jamais seul sur une table à langer.`,`Médicament : jamais sans autorisation.`],
qs:[
[`Une personne doit être transférée du lit au fauteuil. Que faites-vous ?`,`J'utilise le matériel prévu (lève-personne, drap de glisse) et je demande de l'aide`,`Je la soulève seul en la serrant fort`,`Je la tire par les bras`,`Je lui demande de se débrouiller`,`Soulever à mains nues blesse la personne et votre dos.`],
[`Quand se désinfecte-t-on les mains ?`,`Avant et après chaque soin`,`Seulement à la fin de la journée`,`Seulement après les repas`,`Jamais si l'on porte des gants`,`Les mains sont la première source de transmission de microbes.`],
[`Vous vous piquez avec une aiguille usagée. Que faites-vous ?`,`Je lave à l'eau et au savon, je rince, je désinfecte et je préviens aussitôt`,`Je serre la peau sans rien dire`,`Je continue mon travail`,`Je ne dis rien pour éviter les ennuis`,`Il faut agir vite et déclarer l'accident.`],
[`Où met-on une aiguille usagée ?`,`Dans un collecteur pour objets piquants, sans recapuchonner`,`Dans une poubelle ordinaire`,`Dans un sac plastique`,`Sous le lit`,`Une aiguille mal jetée blesse la personne qui ramasse les déchets.`],
[`Vous changez un bébé sur une table à langer. Le téléphone sonne. Que faites-vous ?`,`Je garde une main sur l'enfant ou je l'emmène avec moi`,`Je m'éloigne deux secondes`,`Je laisse l'enfant seul, il est tranquille`,`Je cours décrocher`,`Un enfant peut tomber en quelques secondes. Il ne reste jamais seul.`],
[`Une personne âgée vous demande un médicament. Que faites-vous ?`,`Je ne le donne que si cela est autorisé et prescrit, sinon j'alerte mon responsable`,`Je lui donne le comprimé pour l'aider`,`Je double la dose si elle a mal`,`Je lui donne un médicament que j'ai chez moi`,`Un mauvais médicament peut mettre la vie en danger.`],
[`On vous propose de mélanger deux produits d'entretien. Que faites-vous ?`,`Je refuse et je lis les étiquettes`,`Je les mélange pour plus d'efficacité`,`Je les mélange avec de l'eau chaude`,`Je les mélange en aérant`,`Certains mélanges dégagent un gaz toxique.`],
[`Une personne devient agressive. Que faites-vous ?`,`Je reste calme, je garde mes distances et j'alerte`,`Je la maîtrise physiquement`,`Je réponds en criant`,`Je quitte les lieux sans rien dire`,`Il faut se protéger et alerter plutôt que de s'opposer.`],
[`Un collègue vous demande des détails sur la vie d'une personne suivie. Que faites-vous ?`,`Je n'en dis rien si cela ne concerne pas son travail`,`Je lui raconte tout`,`Je publie sur les réseaux sociaux`,`Je lui montre des photos`,`Le secret professionnel protège la dignité des personnes.`],
[`Vous êtes très fatigué après plusieurs journées chargées. Que faites-vous ?`,`J'en parle à mon tuteur`,`Je ne dis rien pour ne pas passer pour faible`,`Je force pour tenir`,`Je prends des excitants`,`La fatigue augmente le risque d'erreur et de blessure.`]
]},

key:[`Machine arrêtée et consignée avant toute intervention.`,`Masque de soudage, gants et vêtements non synthétiques.`,`Fuite hydraulique : jamais à la main.`,`Carters et protections toujours en place.`],
qs:[
[`Pour souder, vous portez :`,`Un masque de soudage, des gants et des vêtements adaptés`,`Des lunettes de soleil`,`Un simple tablier`,`Rien, pour mieux voir`,`L'arc brûle les yeux et la peau en quelques secondes.`],
[`Avant de dépanner une machine, vous devez :`,`Couper et verrouiller l'énergie avec un cadenas, puis vérifier qu'elle est hors énergie`,`Simplement appuyer sur l'arrêt d'urgence`,`Demander à un collègue de surveiller`,`Intervenir vite avant la reprise de production`,`Une machine non consignée peut redémarrer par erreur.`],
[`Qui retire un cadenas de consignation ?`,`La personne qui l'a posé`,`N'importe quel collègue`,`Le premier arrivé le matin`,`Personne, on le coupe`,`Le cadenas garantit que la personne qui intervient est protégée.`],
[`Vous soupçonnez une fuite d'huile sous pression. Que faites-vous ?`,`Je mets le circuit hors pression et je préviens, je ne cherche jamais à la main`,`Je passe la main près du tuyau`,`Je tape sur le tuyau`,`Je cache la fuite avec un chiffon`,`Un jet d'huile sous pression peut perforer la peau.`],
[`Vous recevez des bouteilles de gaz pour le soudage. Comment les stocker ?`,`Debout, arrimées, à l'abri de la chaleur`,`Couchées sur le sol`,`Posées près d'un feu`,`Appuyées contre un mur sans retenue`,`Une bouteille qui tombe peut devenir un projectile.`],
[`Le carter de protection d'une machine vous gêne. Que faites-vous ?`,`Je ne le retire pas et je préviens mon tuteur`,`Je le retire`,`Je le laisse ouvert`,`Je l'enlève pour le nettoyage en marche`,`Le carter protège les mains des pièces en mouvement.`],
[`Une charge est suspendue au pont roulant. Où vous placez-vous ?`,`À l'écart de sa trajectoire, jamais dessous`,`Dessous pour la guider`,`Dessous si je porte un casque`,`Juste à côté de la charge, à quelques centimètres`,`La chute d'une charge est mortelle.`],
[`Quelle matière de vêtement choisir pour souder ?`,`Du coton ou du cuir, non synthétique`,`Du polyester`,`Du nylon`,`N'importe lequel`,`Les étincelles font fondre les matières synthétiques sur la peau.`],
[`Vous respirez des fumées de soudage. Que faites-vous ?`,`J'utilise l'aspiration et la ventilation prévues`,`Je retire mon masque pour mieux voir`,`Je souffle sur la fumée`,`J'attends d'avoir mal à la gorge`,`Les fumées de soudage sont nocives pour les poumons.`],
[`Vous venez de couper une pièce métallique. Que faites-vous ?`,`Je la considère comme chaude, je mets des gants et je la signale`,`Je la saisis à mains nues`,`Je la laisse sur l'établi sans rien dire`,`Je la pose sur une surface en plastique`,`Une pièce coupée garde longtemps sa chaleur et peut brûler gravement.`]
]},

key:[`Étiquette lue et protections portées avant un traitement.`,`Moteur arrêté avant toute intervention.`,`Tronçonneuse : équipement complet.`,`Chaleur : eau, ombre, pauses.`],
qs:[
[`Avant d'utiliser un produit de traitement, vous devez :`,`Lire l'étiquette et porter les protections indiquées`,`Le sentir pour reconnaître`,`Le mélanger avec un autre pour renforcer son effet`,`Le diluer à l'œil`,`L'étiquette indique les doses, les protections et les précautions.`],
[`Vous voulez pulvériser un produit alors qu'il y a beaucoup de vent. Que faites-vous ?`,`Je reporte le traitement`,`Je traite en me plaçant dos au vent`,`Je traite plus vite`,`Je double la dose`,`Le vent disperse le produit sur vous, les voisins et les cultures.`],
[`Pour utiliser une tronçonneuse, vous portez :`,`Casque avec visière, protections auditives, pantalon anti-coupure et chaussures de sécurité`,`Un short et des sandales`,`Des lunettes de soleil`,`Un simple chapeau`,`Les projections, le bruit et la coupure sont des risques majeurs.`],
[`Un outil est bloqué dans une machine. Que faites-vous ?`,`J'arrête le moteur avant d'intervenir`,`Je le dégage moteur en marche`,`Je le dégage avec un bâton`,`Je laisse un collègue le faire en marche`,`Un moteur en marche peut entraîner la main ou le bras.`],
[`Autour d'une prise de force en marche, vous devez :`,`Garder les protections en place et éviter les vêtements flottants`,`Les retirer pour le nettoyage`,`Passer rapidement à côté`,`Les remplacer par une corde`,`Une prise de force happe les vêtements et les membres.`],
[`Vous conduisez un tracteur sur une pente. Que faites-vous ?`,`Je réduis la vitesse, j'attache ma ceinture et je reste vigilant`,`J'accélère pour passer`,`Je descends en roue libre`,`Je tourne brusquement`,`Le renversement est la première cause d'accident mortel de tracteur.`],
[`Il fait 35 °C et vous travaillez en plein soleil. Que faites-vous ?`,`Je bois régulièrement, je mets un chapeau et je fais des pauses à l'ombre`,`J'attends d'avoir soif pour boire`,`Je travaille torse nu`,`Je saute les pauses pour finir`,`La chaleur provoque épuisement et coup de chaleur.`],
[`Vous vous blessez avec un outil rouillé. Que faites-vous ?`,`Je nettoie, je désinfecte, je préviens et je vérifie mon vaccin contre le tétanos`,`Je ne fais rien`,`Je mets un pansement sans nettoyer`,`Je continue à travailler`,`Une plaie souillée peut provoquer un tétanos.`],
[`Où ranger les produits phytosanitaires ?`,`Dans un local fermé, hors de portée des enfants et des animaux`,`Dans une bouteille d'eau`,`Dans la cuisine`,`À l'air libre derrière la maison`,`Un produit mal rangé peut causer une intoxication grave.`],
[`Vous utilisez une débroussailleuse. Quelle distance respectez-vous avec les autres ?`,`Une distance de sécurité d'au moins quelques mètres`,`Je travaille collé à un collègue`,`Une distance d'un mètre`,`Peu importe`,`Les projections de cailloux et de débris peuvent blesser gravement.`]
]},

lesson:[

],
key:[`Jamais deux produits mélangés.`,`Objet piquant : collecteur, jamais à la main.`,`Circuit de stérilisation : du sale au propre.`,`Gilet haute visibilité sur la voie publique.`],
qs:[
[`Peut-on mélanger de l'eau de Javel et un détartrant ?`,`Non, cela dégage un gaz toxique`,`Oui, pour un meilleur nettoyage`,`Oui, si on aère`,`Oui, avec des gants`,`Ce mélange produit du chlore gazeux dangereux pour les poumons.`],
[`Vous trouvez une seringue sur le trottoir. Que faites-vous ?`,`Je ne la touche pas à mains nues : pince, collecteur, et je signale`,`Je la ramasse avec un mouchoir`,`Je la pousse du pied`,`Je la laisse en place sans rien dire`,`Une piqûre expose à des infections graves.`],
[`Après usage, une aiguille doit être :`,`Jetée directement dans un collecteur sans recapuchonner`,`Recapuchonnée`,`Cassée`,`Mise dans la poubelle ordinaire`,`Le recapuchonnage est une cause fréquente de piqûres.`],
[`En stérilisation, le circuit doit aller :`,`Du sale vers le propre, sans retour`,`Du propre vers le sale`,`Dans les deux sens`,`Au hasard`,`Cela évite de recontaminer le matériel stérilisé.`],
[`Vous ouvrez un autoclave. Que faites-vous ?`,`J'attends la fin du cycle et le refroidissement, puis j'ouvre prudemment`,`J'ouvre immédiatement`,`Je mets mon visage près de la porte`,`J'arrête le cycle en cours`,`La vapeur et le matériel chaud brûlent.`],
[`Sur la voie publique, vous portez :`,`Un gilet haute visibilité`,`Un vêtement sombre`,`Un casque de vélo`,`Rien de particulier`,`Les automobilistes doivent vous voir à distance.`],
[`Vous manipulez du linge souillé. Que faites-vous ?`,`Je porte des gants et je ne le secoue pas`,`Je le serre contre moi`,`Je le secoue pour le trier`,`Je le manipule à mains nues`,`Secouer le linge disperse les microbes dans l'air.`],
[`Un produit n'a pas d'étiquette. Que faites-vous ?`,`Je ne l'utilise pas et je préviens mon tuteur`,`Je le sens pour deviner`,`Je l'utilise en petite quantité`,`Je le mélange avec un autre`,`Un produit non identifié peut être dangereux.`],
[`Un camion benne fait marche arrière. Que faites-vous ?`,`Je me place hors de la zone et je suis visible du conducteur`,`Je passe derrière en vitesse`,`Je monte sur le marchepied`,`Je guide en restant derrière`,`La marche arrière est une cause d'accidents graves.`],
[`Un sac poubelle est très plein. Que faites-vous ?`,`Je ne le tasse pas avec les mains et je le ferme sans le comprimer`,`Je le tasse avec le pied`,`Je le tasse à main nue`,`Je le secoue`,`Il peut contenir des objets coupants ou piquants.`]
]},
{id:'electricite',name:`Électricité`,g:'bolt',
jobs:`Électricien, métiers de l'électricité et de ses environnements connectés, maintenance et efficacité énergétique`,
lead:`Un courant que l'on ne voit pas peut tuer. Le stagiaire n'intervient jamais seul ni sans habilitation.`,
lesson:[
{h:`Habilitation`,ul:[`Sans habilitation adaptée, vous n'intervenez pas sur une installation`,`Le stagiaire travaille sous la conduite d'une personne habilitée, dans les limites autorisées`,`En cas de doute : on s'arrête et on demande`]},
{h:`Mettre hors tension en sécurité`,p:`La séquence de consignation avant un travail :`,ul:[`Séparer l'installation de toute source d'énergie`,`Condamner l'ouverture : cadenas, étiquette`,`Identifier l'ouvrage sur lequel on intervient`,`Vérifier l'absence de tension avec un détecteur adapté, testé avant et après`,`Mettre à la terre et en court-circuit si nécessaire`]},
{h:`Matériel`,ul:[`Outils isolés, détecteur et gants isolants contrôlés avant usage`,`Un tournevis non isolé n'a pas sa place sur un circuit`,`Ne vous fiez jamais à un ancien schéma ni à une étiquette : vérifiez`]},
{h:`Dangers de l'électricité`,ul:[`Électrisation, brûlures, arc électrique et chutes de hauteur`,`L'humidité et l'eau aggravent le danger`,`Câble dénudé, prise cassée : ne touchez pas, signalez`]},
{h:`Personne électrisée`,ul:[`Ne la touchez pas tant qu'elle est en contact avec le courant`,`Coupez d'abord l'alimentation`,`Alertez les secours (15 ou 18) et portez secours`]}
],
key:[`Sans habilitation, on n'intervient pas.`,`Séparer, condamner, identifier, vérifier l'absence de tension.`,`Outils isolés et contrôlés.`,`Électrisé : couper avant de toucher.`],
qs:[
[`Vous n'avez pas d'habilitation électrique. Que pouvez-vous faire ?`,`Observer et aider sous la conduite d'une personne habilitée, sans intervenir seul`,`Intervenir sur une installation qui semble hors tension`,`Dépanner seul un tableau électrique`,`Changer un disjoncteur sans prévenir`,`L'habilitation est obligatoire pour intervenir sur une installation.`],
[`Quelle est la première étape de la mise hors tension ?`,`Séparer l'installation de toutes ses sources d'énergie`,`Vérifier l'absence de tension`,`Mettre à la terre`,`Ouvrir le coffret`,`On sépare d'abord, puis on condamne, on identifie et on vérifie.`],
[`Pourquoi condamne-t-on un circuit avec un cadenas ?`,`Pour empêcher toute remise sous tension par erreur`,`Pour l'identifier`,`Pour le protéger de la pluie`,`Pour gagner de la place`,`Une remise sous tension involontaire peut tuer.`],
[`Avant et après une vérification d'absence de tension, vous :`,`Contrôlez que le détecteur fonctionne sur une source connue`,`Faites confiance à un détecteur non testé`,`Touchez le fil du doigt`,`Utilisez un tournevis`,`Un détecteur défectueux donnerait une fausse sécurité.`],
[`Pour travailler sur un circuit, vous utilisez :`,`Des outils isolés contrôlés`,`N'importe quel tournevis`,`Des outils humides`,`Des outils abîmés`,`Un outil non isolé peut transmettre le courant.`],
[`Un ancien schéma indique que le circuit est hors tension. Que faites-vous ?`,`Je vérifie moi-même l'absence de tension`,`Je me fie au schéma`,`Je me fie à l'étiquette`,`Je me fie à un collègue`,`Les schémas peuvent être faux ou périmés.`],
[`Une personne est électrisée. Que faites-vous en premier ?`,`Je coupe l'alimentation, puis j'alerte les secours`,`Je la saisis à mains nues`,`Je jette de l'eau`,`Je la secoue`,`La toucher sous tension vous électriserait aussi.`],
[`Vous voyez un fil dénudé. Que faites-vous ?`,`Je n'y touche pas et je signale`,`Je l'entoure de ruban adhésif`,`Je le coupe`,`Je le replie`,`Seule une personne habilitée peut réparer.`],
[`Un local est humide et vous devez brancher un appareil. Que faites-vous ?`,`Je demande l'avis d'une personne habilitée et je vérifie le matériel`,`Je branche en faisant attention`,`Je branche pieds nus`,`J'utilise une rallonge abîmée`,`L'eau diminue la résistance de la peau et augmente le danger.`],
[`Vous travaillez en hauteur sur un luminaire. Quel est le danger supplémentaire ?`,`La chute, car l'électrisation peut provoquer un mouvement brusque`,`Aucun`,`Le bruit`,`La chaleur seulement`,`Une électrisation sur une échelle peut entraîner une chute grave.`]
]},

{h:`Électricité et énergies renouvelables`,ul:[`Une intervention électrique exige une habilitation`,`Des panneaux photovoltaïques produisent du courant dès qu'ils reçoivent de la lumière, même déconnectés`,`Batteries et onduleurs : risques de brûlure et d'électrisation`]},

{h:`Charges et chambres froides`,ul:[`Groupes et unités extérieures lourds : aide, sangles, matériel de levage`,`Chambre froide : vérifiez que la porte s'ouvre de l'intérieur, ne restez pas enfermé, portez des vêtements chauds`]}

key:[`Fluides frigorigènes : qualification obligatoire.`,`Panneau solaire : toujours sous tension à la lumière.`,`Toiture : protection contre les chutes avant de monter.`,`Chambre froide : sortie possible de l'intérieur.`],
qs:[
[`Qui peut manipuler un fluide frigorigène ?`,`Une personne qualifiée, ou un stagiaire encadré`,`N'importe qui`,`Un stagiaire seul`,`Un client`,`Les fluides exigent une qualification pour éviter fuites et accidents.`],
[`Un fluide frigorigène fuit dans un local fermé. Que faites-vous ?`,`J'aère, j'évacue et j'alerte`,`Je ferme la porte`,`Je reste pour boucher la fuite`,`Je cherche la fuite avec une flamme`,`Un fluide plus lourd que l'air peut asphyxier.`],
[`Peut-on rejeter un fluide frigorigène dans l'air ?`,`Non, il se récupère`,`Oui, en petite quantité`,`Oui, dehors`,`Oui, s'il est vieux`,`Ces fluides nuisent à l'environnement.`],
[`Un fluide qui se détend brusquement sur la peau :`,`Provoque des gelures`,`Réchauffe la peau`,`Est sans danger`,`Provoque seulement une rougeur`,`La détente refroidit très fortement.`],
[`Un panneau photovoltaïque est déconnecté, mais il fait grand jour. Que pensez-vous ?`,`Il produit encore du courant, je reste prudent`,`Il ne produit plus rien`,`Il est inoffensif`,`Il est sans courant s'il est propre`,`Il produit du courant dès qu'il reçoit de la lumière.`],
[`Avant de monter sur une toiture, vous vérifiez :`,`La protection contre les chutes (garde-corps ou ligne de vie)`,`La couleur des tuiles`,`La météo seulement`,`Rien, si c'est rapide`,`Une chute de toit est souvent grave.`],
[`Vous devez poser un groupe extérieur de 60 kg. Que faites-vous ?`,`J'utilise un moyen de levage ou je demande de l'aide`,`Je le porte seul`,`Je le fais rouler sur le dos`,`Je le tire avec une corde`,`Les charges lourdes demandent du matériel et plusieurs personnes.`],
[`Vous entrez dans une chambre froide. Que vérifiez-vous ?`,`Que la porte s'ouvre de l'intérieur`,`La couleur des murs`,`Rien`,`Que la porte est bien fermée de l'extérieur`,`Rester enfermé dans une chambre froide est un danger vital.`],
[`Avant un brasage, vous :`,`Éloignez les matériaux inflammables et gardez un extincteur à portée`,`Brasez près du carton`,`Retirez les gants`,`Brasez sans protection`,`La flamme met facilement le feu aux matériaux voisins.`],
[`Vous constatez un onduleur qui chauffe et sent le brûlé. Que faites-vous ?`,`Je coupe si c'est possible en sécurité, je m'éloigne et j'alerte`,`Je le touche pour vérifier`,`Je jette de l'eau dessus`,`Je continue mon travail`,`Une surchauffe peut provoquer un incendie.`]
]},
{id:'logistique',name:`Logistique`,g:'box',

lesson:[

{h:`Stockage et rayonnages`,ul:[`Charges lourdes en bas, palettes stables et alignées`,`Respectez la charge maximale indiquée sur le rayonnage`,`Ne grimpez jamais sur un rayonnage`,`Palette abîmée : écartez-la et signalez`]},
{h:`Manutention`,ul:[`Dos droit, jambes fléchies, charge près du corps`,`Charge lourde ou encombrante : aide ou aide mécanique`,`Utilisez des sangles et filets pour arrimer`]},
{h:`Quais et circulation`,ul:[`Calez les camions et vérifiez la plateforme avant d'entrer`,`Restez loin du bord du quai`,`Gilet haute visibilité, piétons sur les allées prévues`,`Marche arrière : demandez un guidage`]},
{h:`Colis et marchandises dangereuses`,ul:[`Lisez les étiquettes de danger`,`Colis endommagé ou fuite : ne touchez pas, éloignez-vous, alertez`]}
],
key:[`Pas de chariot sans autorisation.`,`Charges lourdes en bas, rayonnage respecté.`,`Camion calé avant le chargement.`,`Piétons et chariots : allées séparées.`],
qs:[
[`Qui peut conduire un chariot élévateur ?`,`Une personne formée et autorisée`,`Tout stagiaire`,`Tout le monde s'il est prudent`,`Toute personne majeure`,`La conduite exige une formation et une autorisation de conduite.`],
[`Pour rouler avec un chariot chargé, les fourches sont :`,`Basses, à quelques centimètres du sol`,`Hautes pour mieux voir`,`Inclinées vers l'avant`,`Très hautes`,`Fourches basses = charge stable, centre de gravité bas.`],
[`Peut-on transporter une personne sur les fourches d'un chariot ?`,`Non, jamais`,`Oui, pour atteindre un rayon`,`Oui, sur une palette`,`Oui, si elle est assise`,`C'est interdit. Il existe des nacelles homologuées.`],
[`Où place-t-on les charges les plus lourdes sur un rayonnage ?`,`En bas`,`En haut`,`Au milieu`,`Là où il reste de la place`,`Une charge lourde en hauteur menace de basculer.`],
[`Un camion est à quai. Que vérifiez-vous avant d'y entrer ?`,`Qu'il est calé et que la plateforme est stable`,`La couleur du camion`,`Rien, le chauffeur gère`,`Que le moteur tourne`,`Un camion qui avance ou s'éloigne du quai provoque des chutes.`],
[`Vous devez soulever un colis lourd. Que faites-vous ?`,`Je plie les jambes, je garde le dos droit et je demande de l'aide si besoin`,`Je plie le dos`,`Je le soulève d'un coup`,`Je tourne le buste en portant`,`Le dos se protège avec la bonne technique.`],
[`Une palette est cassée. Que faites-vous ?`,`Je l'écarte et je la signale`,`Je la réutilise`,`Je la remets au stock`,`Je la renforce avec du ruban adhésif`,`Une palette abîmée peut céder.`],
[`Un chariot recule dans l'allée. Que faites-vous ?`,`Je reste visible, je m'écarte et je porte un gilet`,`Je passe derrière`,`Je traverse en courant`,`Je me place derrière pour guider`,`La marche arrière réduit fortement la visibilité du conducteur.`],
[`Un colis fuit et une odeur forte s'en dégage. Que faites-vous ?`,`Je m'éloigne, je ne le touche pas et j'alerte`,`Je l'ouvre pour voir`,`Je le renifle`,`Je le déplace`,`Un colis qui fuit peut contenir un produit dangereux.`],
[`Vous avez besoin d'un objet en haut du rayonnage. Que faites-vous ?`,`J'utilise un escabeau ou une plateforme prévue`,`J'escalade les montants`,`Je monte sur une palette`,`Je saute`,`Un rayonnage n'est pas une échelle.`]
]},
{id:'securite',name:`Sécurité`,g:'shield',
jobs:`Métiers de la sécurité, agent de sécurité`,
lead:`Observer, prévenir, alerter : l'agent de sécurité protège les biens et les personnes dans un cadre précis, sans se mettre en danger.`,
lesson:[
{h:`Votre rôle et ses limites`,ul:[`Vous observez, vous prévenez et vous alertez`,`Votre action s'exerce dans un cadre légal : pas de violence, pas de fouille sans accord`,`Un stagiaire n'intervient jamais seul dans une situation risquée`]},
{h:`Gérer un conflit`,ul:[`Restez calme, distance de sécurité, voix posée`,`Ne provoquez pas, ne répondez pas aux insultes`,`Demandez des renforts ou appelez les forces de l'ordre si nécessaire`]},
{h:`Rondes et travail isolé`,ul:[`Gardez un moyen d'alerte : radio ou téléphone chargé`,`Signalez votre position et vos horaires`,`Éclairage, escaliers et zones isolées : vigilance accrue`]},
{h:`Incendie et évacuation`,ul:[`Connaissez les issues, les extincteurs et le point de rassemblement`,`Donnez l'alerte, puis aidez à l'évacuation sans vous mettre en danger`]},
{h:`Fatigue, nuit et secours`,ul:[`Les horaires de nuit fatiguent : reposez-vous, restez vigilant`,`Apprenez les gestes de premiers secours et repérez le défibrillateur`,`Respect, discrétion et confidentialité envers les personnes`]}
],
key:[`Observer, prévenir, alerter.`,`Jamais seul face à un danger.`,`Calme et distance dans un conflit.`,`Un moyen d'alerte toujours chargé.`],
qs:[
[`Quel est le rôle principal d'un agent de sécurité ?`,`Observer, prévenir et alerter`,`Remplacer la police`,`Punir les personnes`,`Poursuivre les voleurs`,`L'agent agit dans un cadre légal, sans se substituer aux forces de l'ordre.`],
[`Une personne agressive vous insulte. Que faites-vous ?`,`Je reste calme, je garde mes distances et je demande du renfort`,`Je réponds sur le même ton`,`Je la bouscule`,`Je la fouille`,`Le calme désamorce la tension. La violence est interdite.`],
[`Vous voyez plusieurs personnes en train de dégrader un lieu. Que faites-vous ?`,`J'alerte mon responsable et les secours ou la police`,`J'interviens seul`,`Je les poursuis`,`Je prends un objet pour me défendre`,`Face au nombre, la sécurité passe par l'alerte.`],
[`Lors d'une ronde de nuit, vous devez avoir :`,`Un moyen d'alerte chargé et une lampe`,`Rien, pour rester discret`,`Seulement une lampe`,`Un téléphone éteint`,`Un moyen d'alerte permet d'appeler des secours si besoin.`],
[`Peut-on fouiller le sac d'une personne sans son accord ?`,`Non, sauf cadre légal précis`,`Oui, par principe`,`Oui, si elle a l'air suspecte`,`Oui, si le client le demande`,`Une fouille exige un cadre légal et l'accord de la personne.`],
[`Vous êtes seul de nuit et une alarme se déclenche. Que faites-vous ?`,`J'alerte, j'observe de loin et je n'entre pas seul si le danger est possible`,`J'entre immédiatement`,`J'éteins l'alarme sans regarder`,`Je rentre chez moi`,`Votre sécurité passe avant tout.`],
[`Un incendie se déclare. Que faites-vous ?`,`Je donne l'alerte, j'aide à l'évacuation sans me mettre en danger`,`Je cherche la cause`,`J'ouvre toutes les fenêtres`,`J'utilise l'ascenseur`,`Alerte et évacuation sont les priorités.`],
[`Vous êtes très fatigué au milieu de la nuit. Que faites-vous ?`,`Je préviens mon responsable et je prends une pause`,`Je m'endors à mon poste`,`Je bois beaucoup de café`,`Je cache ma fatigue`,`La fatigue réduit la vigilance et augmente le risque d'accident.`],
[`Une personne fait un malaise devant vous. Que faites-vous ?`,`J'alerte les secours, je protège et j'applique les gestes de premiers secours`,`Je m'éloigne`,`Je lui donne à boire`,`J'attends qu'elle se relève`,`Alerter les secours et agir vite peut sauver la personne.`],
[`Un collègue vous demande de ne pas signaler un incident. Que faites-vous ?`,`Je le signale quand même à mon responsable`,`Je me tais`,`Je le fais à sa place`,`J'attends`,`Un incident non signalé laisse le danger en place.`]
]},
{id:'mode',name:`Mode & arts appliqués`,g:'shirt',
jobs:`Métiers de la mode vêtement flou, artisanat et métiers d'art option communication visuelle plurimédia`,
lead:`Atelier de couture ou de création visuelle : outils coupants, postures prolongées, colles et écrans.`,
lesson:[

{h:`Découpe et cutters`,ul:[`Plan de coupe stable, cutter à lame rétractable`,`Coupez loin du corps et lame rentrée après usage`,`Ciseaux : passez-les pointes vers le bas`]},

],
key:[`Débrancher avant de nettoyer la machine.`,`Cutter : lame rentrée, coupe loin du corps.`,`Fer débranché après usage.`,`Colles et solvants : étiquette, aération, gants.`],
qs:[
[`Avant de nettoyer une machine à coudre, vous devez :`,`La débrancher`,`La laisser allumée`,`Retirer l'aiguille en marche`,`Nettoyer avec la main`,`Un démarrage accidentel blesse les doigts.`],
[`Où ranger les aiguilles et les épingles ?`,`Dans une pelote ou une boîte`,`Dans la bouche`,`Dans la poche`,`Sur la table`,`Elles piquent, se perdent et peuvent être avalées.`],
[`Pour couper avec un cutter, vous :`,`Coupez loin de votre corps et rentrez la lame après usage`,`Coupez vers vous`,`Laissez la lame sortie`,`Tenez le tissu avec la main libre au ras de la lame`,`La lame qui dérape blesse la main ou la cuisse.`],
[`Votre fer à repasser reste chaud. Que faites-vous après usage ?`,`Je le débranche et le pose sur son talon`,`Je le laisse branché`,`Je le pose sur le tissu`,`Je le range chaud dans un tiroir`,`Un fer chaud peut brûler ou mettre le feu.`],
[`Vous utilisez une colle avec solvant. Que faites-vous ?`,`J'aère, je lis l'étiquette et je porte des gants`,`Je la sens pour vérifier`,`Je ferme les fenêtres`,`J'en mets sur les mains`,`Les vapeurs irritent et peuvent donner des maux de tête.`],
[`Peut-on manger à son poste de travail ?`,`Non, surtout avec des colles ou des encres`,`Oui, si les mains sont propres`,`Oui, un petit en-cas`,`Oui, du moment qu'on ne tache pas`,`Les produits peuvent contaminer les aliments.`],
[`Des chiffons imbibés de solvant doivent être :`,`Rangés dans un récipient fermé, loin des sources de chaleur`,`Laissés en tas`,`Jetés dans la poubelle commune`,`Posés sur un radiateur`,`Ils s'enflamment facilement.`],
[`Vous passez de longues heures assis à la machine. Que faites-vous ?`,`Je règle mon siège et je fais des pauses`,`Je ne bouge pas`,`Je me penche vers l'ouvrage`,`Je saute les pauses`,`Une mauvaise posture et un éclairage insuffisant fatiguent le dos et les yeux.`],
[`Une prise est surchargée de multiprises. Que faites-vous ?`,`Je débranche et je signale`,`Je la laisse`,`J'ajoute une multiprise`,`Je la couvre`,`Une prise surchargée chauffe et peut provoquer un incendie.`],
[`Vous passez des ciseaux à une collègue. Comment ?`,`Pointes vers le bas, manche vers elle`,`Pointes vers elle`,`Lancés`,`Fermés ou ouverts, peu importe`,`Cela évite de la blesser.`]
]},
{id:'numerique',name:`Numérique`,g:'screen',
jobs:`Cybersécurité informatique et réseaux électronique, cybersécurité, service numérique aux organisations`,
lead:`Écrans, câbles, baies et données : le métier mêle confort au poste, électricité et sécurité des informations.`,
lesson:[
{h:`Poste de travail`,ul:[`Haut de l'écran à hauteur des yeux, dos soutenu, pieds au sol`,`Toutes les 20 minutes environ, regardez au loin quelques secondes`,`Pause régulière pour se lever et bouger`]},
{h:`Câbles et électricité`,ul:[`Câbles rangés, jamais au sol dans un passage`,`Ne surchargez pas les multiprises`,`Débranchez avant d'ouvrir un équipement, et reliez-vous à la masse pour limiter l'électricité statique`]},
{h:`Salle serveur et baies`,ul:[`Bruit, froid et ventilation : protections auditives si nécessaire`,`Équipements lourds (onduleurs, serveurs, batteries) : aide et matériel de levage`,`Connaissez la procédure d'alarme et d'évacuation de la salle`]},
{h:`Hygiène numérique`,ul:[`Mot de passe personnel, jamais partagé`,`Méfiez-vous des courriels qui demandent des informations ou un clic urgent (hameçonnage)`,`Ne branchez jamais une clé USB inconnue`,`Signalez tout incident ou doute à votre responsable`]},
{h:`Travail en hauteur`,ul:[`Chemins de câbles et faux plafonds : échelle stable, trois points d'appui`,`Coupez l'alimentation avant de toucher à un câble ou à un équipement inconnu`]}
],
key:[`Écran à hauteur des yeux, pauses régulières.`,`Débrancher avant d'ouvrir un équipement.`,`Mot de passe jamais partagé.`,`Clé USB inconnue : jamais.`],
qs:[
[`Vous recevez un courriel urgent qui demande votre mot de passe. Que faites-vous ?`,`Je ne réponds pas et je le signale`,`Je donne mon mot de passe`,`Je clique sur le lien pour vérifier`,`Je transfère à mes collègues`,`C'est une tentative d'hameçonnage classique.`],
[`Vous trouvez une clé USB sur le parking. Que faites-vous ?`,`Je ne la branche pas et je la remets à mon responsable`,`Je la branche pour trouver son propriétaire`,`Je la branche sur un ordinateur isolé`,`Je la garde`,`Une clé inconnue peut contenir un logiciel malveillant.`],
[`Peut-on prêter son mot de passe à un collègue ?`,`Non, il est personnel`,`Oui, pour dépanner`,`Oui, si on le connaît bien`,`Oui, si on le change après`,`Un mot de passe partagé empêche de savoir qui a fait quoi.`],
[`Avant d'ouvrir un équipement électronique, vous :`,`Le débranchez et vous déchargez l'électricité statique`,`Le laissez allumé`,`Utilisez un tournevis métallique sur les composants`,`Touchez les composants sans précaution`,`Un équipement sous tension peut électriser et l'électricité statique abîme les composants.`],
[`Quelle est la hauteur idéale de l'écran ?`,`Le haut de l'écran à hauteur des yeux`,`Au niveau des genoux`,`Au-dessus de la tête`,`Sur le côté`,`Cela évite de plier la nuque et fatigue moins les yeux.`],
[`Pour reposer les yeux, vous :`,`Regardez au loin quelques secondes régulièrement`,`Fixez l'écran sans interruption`,`Augmentez la luminosité au maximum`,`Cessez de cligner`,`Une pause visuelle limite la fatigue des yeux.`],
[`Dans la salle serveur, l'alarme d'extinction se déclenche. Que faites-vous ?`,`J'évacue immédiatement par la sortie prévue`,`Je termine mon travail`,`Je ferme la porte et je reste`,`Je désactive l'alarme`,`Les gaz d'extinction peuvent être dangereux à respirer.`],

var SECTMOD={};
function sectorMod(x){
  if(!SECTMOD[x.id]){ SECTMOD[x.id]={id:'s_'+x.id,t:x.name,min:5,sign:{shape:'circle',col:'blue',g:x.g},lead:x.lead,lesson:x.lesson,key:x.key,jobs:x.jobs,sector:true}; }

function mods(){
  var l=MODS.slice(); var x=(typeof S!=='undefined'&&S&&S.profile&&SECT[S.profile.sector])?SECT[S.profile.sector]:null;

var KEY='code-prevention-v1';
function blank(){return {read:{},train:{},attempts:[],passed:null,profile:null,badgeSeen:false};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return Object.assign(blank(),o);}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var view={name:'home'}, run=null;

var app=document.getElementById('app');
document.getElementById('logo').innerHTML=sign({shape:'square',col:'green',g:'cross'},34);

/* ---------- Utilitaires ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function modById(id){return MODS.concat(SECTORS.map(sectorMod)).filter(function(m){return m.id===id;})[0];}
function inst(x){
  var opts=shuffle([{t:x.o[0],ok:true}].concat(x.o.slice(1).map(function(t){return {t:t,ok:false};})));
  return {m:x.m,q:x.q,opts:opts,e:x.e};
}
function go(v){if(v&&v.name==='badge'&&S.passed&&!S.badgeSeen){S.badgeSeen=true;save();} view=v;render();window.scrollTo(0,0);}
function hasProfile(){return !!(S.profile&&S.profile.sector&&SECT[S.profile.sector]);}
function frDate(iso){return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}

function reviewHtml(items,ans){
  var bad=[];

  return '<h2 style="margin-top:26px">À revoir ('+bad.length+')</h2><div class="review">'+bad.map(function(i){
    var it=items[i], good=it.opts.filter(function(o){return o.ok;})[0];
    return '<div class="rev"><p class="q">'+esc(it.q)+'</p><p class="no">Votre réponse : '+esc(it.opts[ans[i]].t)+'</p><p class="yes">Bonne réponse : '+esc(good.t)+'</p><p>'+esc(it.e)+'</p></div>';
  }).join('')+'</div>';
}

/* ---------- Actions ---------- */
function startQuiz(mode,modId){
  var items;
  if(mode==='train'){ items=shuffle(BANK.filter(function(x){return x.m===modId;})).slice(0,TRAIN_N).map(inst); }
  else { items=shuffle(mods().reduce(function(acc,m){return acc.concat(shuffle(BANK.filter(function(x){return x.m===m.id;})).slice(0,m.sector?SEC_N:PER_MOD));},[])).map(inst); }
  run={mode:mode,modId:modId,items:items,i:0,ans:[],sel:null,locked:false,confirmQuit:false,result:null};
  go({name:'quiz'});
}
function finishQuiz(){
  var items=run.items, ans=run.ans;
  var score=items.filter(function(it,i){return it.opts[ans[i]].ok;}).length;
  var r={mode:run.mode,modId:run.modId,score:score,total:items.length};
  if(run.mode==='exam'){
    r.byMod=mods().map(function(m){
      var ok=0,n=0; items.forEach(function(it,i){ if(it.m===m.id){ n++; if(it.opts[ans[i]].ok) ok++; } });
      return {id:m.id,ok:ok,n:n};
    });
    var iso=new Date().toISOString();
    S.attempts.push({score:score,date:iso});
    if(score>=EXAM_PASS && (!S.passed || score>=S.passed.score)){
      var pf=S.profile||{first:'',last:'',school:'',sector:''}, nm=(pf.first+' '+pf.last).trim();
      S.passed={score:score,date:iso,first:pf.first,last:pf.last,org:pf.school,sector:pf.sector,name:nm,ref:makeRef(nm.toLowerCase()+'|'+iso+'|'+score+(pf.sector?'|'+pf.sector:''))};
    }
  } else {
    var t=S.train[run.modId]; if(!t||score>t.best){ S.train[run.modId]={best:score,total:items.length}; }
  }
  save(); run.result=r; go({name:'result'});
}
function makeRef(s){
  var h1=2166136261,h2=5381;
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}
  var t=(h1.toString(36)+h2.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,'');
  t=(t+'00000000').slice(0,8); return t.slice(0,4)+'-'+t.slice(4);
}
function submitProfile(ev){
  ev.preventDefault();
  var first=document.getElementById('p-first').value.trim(), last=document.getElementById('p-last').value.trim(), school=document.getElementById('p-school').value.trim();
  var sector=S.passed&&S.passed.sector?S.passed.sector:(document.querySelector('input[name="sector"]:checked')||{}).value;
  if(!first||!last||!school||!SECT[sector]){ document.getElementById('p-err').textContent='Renseignez votre prénom, votre nom, votre établissement et votre secteur.'; return; }
  S.profile={first:first,last:last,school:school,sector:sector};
  if(S.passed){ var P=S.passed; P.first=first; P.last=last; P.org=school; P.name=first+' '+last; P.ref=makeRef(P.name.toLowerCase()+'|'+P.date+'|'+P.score+(P.sector?'|'+P.sector:'')); }
  save(); go({name:'home'});
}

app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='open') go({name:'module',id:id});
  else if(a==='toggleread'){ if(S.read[id]) delete S.read[id]; else S.read[id]=true; save(); render(); }
  else if(a==='train') startQuiz('train',id);
  else if(a==='exam'){ if(hasProfile()) startQuiz('exam'); }
  else if(a==='badge') go({name:'badge'});
  else if(a==='home') go({name:'home'});
  else if(a==='editprofile') go({name:'home',editProfile:true});
  else if(a==='quit'){ run.confirmQuit=true; render(); }
  else if(a==='quitno'){ run.confirmQuit=false; render(); }
  else if(a==='quityes'){ run=null; go({name:'home'}); }
  else if(a==='pick'){
    var k=parseInt(el.getAttribute('data-k'),10);
    if(run.mode==='exam'){ run.sel=k; render(); }
    else if(!run.locked){ run.sel=k; run.locked=true; render(); }
  }
  else if(a==='next'){
    if(run.sel===null) return;
    run.ans[run.i]=run.sel;
    if(run.i===run.items.length-1){ finishQuiz(); return; }
    run.i++; run.sel=null; run.locked=false; render(); window.scrollTo(0,0);
  }
  else if(a==='download') doDownload();
});
document.querySelector('.brand').addEventListener('click',function(){ go({name:'home'}); });

/* ---------- Badge (canvas) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
function fit(c,txt,weight,family,max,start){var s=start;do{c.font=weight+' '+s+'px '+family;s-=2;}while(c.measureText(txt).width>max&&s>16);}
async function drawBadge(cv,P){
  try{ await Promise.all([document.fonts.load('700 80px "Barlow Condensed"'),document.fonts.load('600 40px "Barlow Condensed"'),document.fonts.load('500 40px "Barlow"')]); }catch(e){}
  var W=1080,H=1350,c=cv.getContext('2d'); cv.width=W; cv.height=H;
  var DISP='"Barlow Condensed","Arial Narrow",Arial,sans-serif', TXT='"Barlow",Arial,sans-serif';
  c.fillStyle='#0B7A4B'; rr(c,0,0,W,H,90); c.fill();
  c.strokeStyle='#FFFFFF'; c.lineWidth=12; rr(c,40,40,W-80,H-80,58); c.stroke();
  c.textAlign='center'; c.textBaseline='alphabetic';
  try{c.letterSpacing='6px';}catch(e){}
  c.fillStyle='rgba(255,255,255,.82)'; c.font='600 38px '+DISP; c.fillText('CODE PRÉVENTION · STAGIAIRES',W/2,125);
  try{c.letterSpacing='0px';}catch(e){}
  c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(W/2,385,175,0,Math.PI*2); c.fill();
  c.strokeStyle='#0B7A4B'; c.lineWidth=40; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(W/2-95,390); c.lineTo(W/2-25,460); c.lineTo(W/2+105,310); c.stroke();

var dlApi=null;
async function initDownload(){
  try{ dlApi=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(e){ dlApi=null; }
}

/* ---------- Récapitulatif DAFPIC ---------- */
var PW_SHA='2e58d014d5680280efcad397e8e7d00ae99e3871f4a48f1c9b11a2af9716aa3d', PW_WEAK='wtepd9.e9jjx3';
var R={ok:false,list:[],mode:'local',db:null,q:'',flt:'',fk:'',loaded:false,confirmClear:false,note:''};
var LSKEY='cp-recap-v1';
function lsLoad(){try{var r=localStorage.getItem(LSKEY);return r?JSON.parse(r):[];}catch(e){return [];}}
function lsSave(l){try{localStorage.setItem(LSKEY,JSON.stringify(l));}catch(e){}}
function weak(t){var h1=2166136261,h2=5381;for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}return h1.toString(36)+'.'+h2.toString(36);}
async function sha(t){
  try{ if(window.crypto&&crypto.subtle){ var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); } }catch(e){}
  return null;
}
function encodeCode(P){
  var j=JSON.stringify({f:P.first,l:P.last,e:P.org,k:P.sector||'',s:P.score,d:P.date,r:P.ref});
  return 'CP2.'+btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeCode(t){
  var m=t.match(/CP[12]\.([A-Za-z0-9_-]+)/); if(!m) return null;
  try{
    var b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    var j=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!j||!j.f||!j.l||!j.e||typeof j.s!=='number'||!j.d||!j.r) return null;
    j.k=j.k||''; j.ok=(makeRef((j.f+' '+j.l).toLowerCase()+'|'+j.d+'|'+j.s+(j.k?'|'+j.k:''))===j.r)&&j.s>=EXAM_PASS&&j.s<=EXAM_N;
    return j;
  }catch(e){ return null; }
}
function mergeByRef(a,b){var seen={},out=[];a.concat(b).forEach(function(x){if(!seen[x.r]){seen[x.r]=1;out.push(x);}});return out;}
async function recapLoad(){
  R.note=''; R.db=null; R.mode='local';
  var db=null; try{ db=(window.claude&&window.claude.use)?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(db){ try{ var snap=await db.collection('recap').limit(1000).get(); R.list=snap.docs.map(function(d){return d.data();}); R.db=db; R.mode='db'; }catch(e){ R.db=null; } }
  if(R.mode==='local'){ R.list=lsLoad(); }
  R.loaded=true;
}
async function recapPut(rec){
  if(R.mode==='db'){ try{ await R.db.doc('recap/'+rec.r).set(rec); return; }catch(e){ R.mode='local'; R.note='L\'enregistrement partagé est indisponible : la liste est conservée sur cet appareil.'; R.list=mergeByRef(lsLoad(),R.list); } }
}
async function recapDel(ref){
  if(R.mode==='db'){ try{ await R.db.doc('recap/'+ref).delete(); }catch(e){} }
  R.list=R.list.filter(function(x){return x.r!==ref;});
  if(R.mode==='local') lsSave(R.list);
}
function sortedList(){return R.list.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.l+a.f).localeCompare(b.l+b.f);});}
function filteredList(){
  var q=R.q.trim().toLowerCase();
  return sortedList().filter(function(x){
    if(R.flt && x.e!==R.flt) return false;
    if(R.fk && (x.k||'')!==R.fk) return false;
    if(q && (x.f+' '+x.l+' '+x.e+' '+x.r).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function schoolsList(){var o={};R.list.forEach(function(x){o[x.e]=1;});return Object.keys(o).sort();}
function secName(k){return SECT[k]?SECT[k].name:'—';}
function usedSectors(){var o={};R.list.forEach(function(x){if(x.k) o[x.k]=1;});return Object.keys(o).sort(function(a,b){return secName(a).localeCompare(secName(b));});}
function fmtD(iso){return new Date(iso).toLocaleDateString('fr-FR');}

function viewRecap(){
  if(!R.ok){
    return '<p class="eyebrow">Espace DAFPIC</p><h1 style="margin-bottom:12px">Récapitulatif</h1>'+
      '<p class="lead" style="margin-bottom:16px">Accès réservé. Saisissez le mot de passe pour consulter la liste des jeunes formés.</p>'+
      '<form class="form" id="gate" novalidate><div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="off"></div>'+
      '<p class="note" id="pw-err" role="alert" style="color:var(--red)"></p><button class="btn" type="submit">Accéder</button></form>';
  }
  var n=R.list.length, sc=schoolsList(), ko=R.list.filter(function(x){return !x.ok;}).length;
  var opts='<option value="">Tous les établissements</option>'+sc.map(function(e){return '<option value="'+esc(e)+'"'+(R.flt===e?' selected':'')+'>'+esc(e)+'</option>';}).join('');
  var clear=R.confirmClear?
    '<div class="confirm"><p><b>Vider toute la liste ?</b> Les '+n+' enregistrements seront supprimés. Exportez-les d\'abord si besoin.</p><div class="actions" style="margin:0"><button class="btn ghost" data-act="clearno">Annuler</button><button class="btn" style="background:var(--red);border-color:var(--red);color:#fff" data-act="clearyes">Oui, tout supprimer</button></div></div>':'';
  return '<p class="eyebrow">Espace DAFPIC</p><h1>Récapitulatif</h1>'+
    '<div class="stats"><div class="stat"><b>'+n+'</b><span>jeune'+(n>1?'s':'')+' formé'+(n>1?'s':'')+'</span></div><div class="stat"><b>'+sc.length+'</b><span>établissement'+(sc.length>1?'s':'')+'</span></div><div class="stat"><b>'+usedSectors().length+'</b><span>secteur'+(usedSectors().length>1?'s':'')+'</span></div>'+(ko?'<div class="stat"><b>'+ko+'</b><span>à vérifier</span></div>':'')+'</div>'+
    '<p class="note" style="margin-bottom:14px">'+(R.mode==='db'?'Liste enregistrée dans l\'espace protégé de ce document, accessible depuis tous vos appareils.':'Liste enregistrée sur cet appareil uniquement. Exportez-la régulièrement en Excel.')+(R.note?' '+esc(R.note):'')+'</p>'+
    '<div class="panel"><h2>Ajouter des résultats</h2><p class="note">Chaque jeune qui réussit l\'examen reçoit un code de résultat. Collez ici les codes reçus, un par ligne.</p>'+
    '<textarea id="codes" placeholder="CP2...." aria-label="Codes de résultat"></textarea>'+
    '<div class="actions" style="margin:0"><button class="btn" data-act="import">Ajouter à la liste</button></div><p class="msg" id="rmsg" role="status"></p></div>'+
    '<div class="filters"><select id="flt" aria-label="Filtrer par établissement">'+opts+'</select><select id="fk" aria-label="Filtrer par secteur"><option value="">Tous les secteurs</option>'+usedSectors().map(function(k){return '<option value="'+k+'"'+(R.fk===k?' selected':'')+'>'+esc(secName(k))+'</option>';}).join('')+'</select><input id="q" type="search" placeholder="Rechercher un nom" value="'+esc(R.q)+'" aria-label="Rechercher"></div>'+
    '<div id="rt"></div>'+clear+
    '<div class="actions"><button class="btn" data-act="export"'+(n?'':' disabled')+'>Exporter en Excel</button>'+(n?'<button class="btn ghost" data-act="clearask">Vider la liste</button>':'')+'</div>';
}
function renderTable(){
  var box=document.getElementById('rt'); if(!box) return;
  var l=filteredList();
  if(!l.length){ box.innerHTML='<div class="tablewrap"><p class="empty">'+(R.list.length?'Aucun résultat pour ce filtre.':'Aucun jeune enregistré pour le moment. Collez les codes de résultat reçus ci-dessus.')+'</p></div>'; return; }
  box.innerHTML='<div class="tablewrap"><table><thead><tr><th>Nom</th><th>Prénom</th><th>Établissement</th><th>Secteur</th><th>Score</th><th>Date</th><th>Réf.</th><th>Contrôle</th><th><span class="sr" style="position:absolute;left:-9999px">Supprimer</span></th></tr></thead><tbody>'+
    l.map(function(x){return '<tr><td>'+esc(x.l)+'</td><td>'+esc(x.f)+'</td><td>'+esc(x.e)+'</td><td>'+esc(secName(x.k))+'</td><td class="num">'+x.s+' / '+EXAM_N+'</td><td class="num">'+fmtD(x.d)+'</td><td class="num">'+esc(x.r)+'</td><td><span class="chk '+(x.ok?'ok':'ko')+'">'+(x.ok?'Conforme':'À vérifier')+'</span></td><td><button class="rowdel" data-act="delrow" data-id="'+esc(x.r)+'" aria-label="Supprimer '+esc(x.f+' '+x.l)+'">Supprimer</button></td></tr>';}).join('')+
    '</tbody></table></div><p class="note" style="margin-top:6px">'+l.length+' ligne'+(l.length>1?'s':'')+' affichée'+(l.length>1?'s':'')+'.</p>';
}
function setMsg(t){var m=document.getElementById('rmsg'); if(m) m.textContent=t;}
function bindRecap(){
  var g=document.getElementById('gate'); if(g) g.addEventListener('submit',submitGate);
  var q=document.getElementById('q'), f=document.getElementById('flt');
  if(q) q.addEventListener('input',function(){R.q=q.value;renderTable();});
  if(f) f.addEventListener('change',function(){R.flt=f.value;renderTable();});
  var fk=document.getElementById('fk'); if(fk) fk.addEventListener('change',function(){R.fk=fk.value;renderTable();});
  if(R.ok) renderTable();
}
async function submitGate(ev){
  ev.preventDefault();
  var pw=document.getElementById('pw').value, err=document.getElementById('pw-err');
  var h=await sha(pw), good=h?(h===PW_SHA):(weak(pw)===PW_WEAK);
  if(!good){ err.textContent='Mot de passe incorrect.'; return; }
  R.ok=true; err.textContent='Chargement…'; await recapLoad(); render();
}
async function doImport(){
  var ta=document.getElementById('codes'); if(!ta) return;
  var found=ta.value.match(/CP[12]\.[A-Za-z0-9_-]+/g)||[];
  if(!found.length){ setMsg('Aucun code reconnu. Un code commence par CP.'); return; }
  var add=0,dup=0,bad=0;
  for(var i=0;i<found.length;i++){
    var j=decodeCode(found[i]);
    if(!j){bad++;continue;}
    if(R.list.some(function(x){return x.r===j.r;})){dup++;continue;}
    var rec={r:j.r,f:j.f,l:j.l,e:j.e,k:j.k||'',s:j.s,d:j.d,ok:j.ok,t:new Date().toISOString()};
    await recapPut(rec); R.list.push(rec); add++;
  }
  if(R.mode==='local') lsSave(R.list);
  var msg=add+' ajouté'+(add>1?'s':'')+(dup?', '+dup+' déjà présent'+(dup>1?'s':''):'')+(bad?', '+bad+' illisible'+(bad>1?'s':''):'')+'.';
  render(); setMsg(msg);
}
async function saveBlob(blob,fname){
  if(!dlApi){ try{ dlApi=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(e){ dlApi=null; } }
  if(dlApi){ try{ await dlApi.save({filename:fname,data:blob}); return 'saved'; }catch(err){ return (err&&err.code==='declined')?'declined':'error'; } }
  var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000); return 'saved';
}
async function doExport(){
  var list=sortedList(); if(!list.length) return;
  var head=['Nom','Prénom','Établissement','Secteur','Score','Sur','Date de réussite','Référence','Contrôle'];
  var rows=[head].concat(list.map(function(x){return [x.l,x.f,x.e,secName(x.k),x.s,EXAM_N,fmtD(x.d),x.r,x.ok?'Conforme':'À vérifier'];}));
  var by={}; list.forEach(function(x){by[x.e]=(by[x.e]||0)+1;});
  var rows2=[['Établissement','Jeunes formés']].concat(Object.keys(by).sort().map(function(k){return [k,by[k]];}));
  var bs={}; list.forEach(function(x){var n=secName(x.k); bs[n]=(bs[n]||0)+1;});
  var rows3=[['Secteur','Jeunes formés']].concat(Object.keys(bs).sort().map(function(k){return [k,bs[k]];}));
  var stamp=new Date().toISOString().slice(0,10), blob, name;
  if(window.XLSX){
    var ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:20},{wch:18},{wch:34},{wch:32},{wch:8},{wch:6},{wch:16},{wch:12},{wch:14}];
    var ws2=XLSX.utils.aoa_to_sheet(rows2); ws2['!cols']=[{wch:40},{wch:14}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Jeunes formés'); XLSX.utils.book_append_sheet(wb,ws2,'Par établissement'); var ws3=XLSX.utils.aoa_to_sheet(rows3); ws3['!cols']=[{wch:40},{wch:14}]; XLSX.utils.book_append_sheet(wb,ws3,'Par secteur');
    blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    name='recapitulatif-code-prevention-'+stamp+'.xlsx';
  } else {
    var esc2=function(v){v=String(v);if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"';};
    blob=new Blob(['﻿'+rows.map(function(r){return r.map(esc2).join(';');}).join('\r\n')],{type:'text/csv'});
    name='recapitulatif-code-prevention-'+stamp+'.csv';
  }
  var r=await saveBlob(blob,name);
  setMsg(r==='saved'?'Fichier exporté : '+name:(r==='declined'?'Export annulé.':'L\'export a échoué. Réessayez.'));
}
function updateTabs(){
  var cur=view.name==='recap'?'recap':'home';
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    if(b.getAttribute('data-tab')===cur) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
document.querySelector('.tabs').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-tab]'); if(!b) return;
  if(b.getAttribute('data-tab')==='home'){ go({name:'home'}); return; }
  go({name:'recap'});
  if(R.ok && !R.loaded){ recapLoad().then(function(){ if(view.name==='recap') render(); }); }
});
app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='import') doImport();
  else if(a==='export') doExport();
  else if(a==='delrow'){ recapDel(id).then(function(){ render(); }); }
  else if(a==='clearask'){ R.confirmClear=true; render(); }
  else if(a==='clearno'){ R.confirmClear=false; render(); }
  else if(a==='clearyes'){
    var ids=R.list.map(function(x){return x.r;}); R.confirmClear=false;
    (async function(){ for(var i=0;i<ids.length;i++){ await recapDel(ids[i]); } render(); })();
  }
  else if(a==='copycode'){
    var ta=document.getElementById('code'), m=document.getElementById('cmsg'); if(!ta) return;
    ta.select();
    var fb=function(){ try{document.execCommand('copy');}catch(e){} if(m) m.textContent='Code sélectionné. Copiez-le avec le menu de votre appareil.'; };
    try{ navigator.clipboard.writeText(ta.value).then(function(){ if(m) m.textContent='Code copié.'; }).catch(fb); }catch(e){ fb(); }
  }
});

render();
})();
</script>
