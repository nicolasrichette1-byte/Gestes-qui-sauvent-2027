<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EBF3F4;--card:#fff;--ink:#12303A;--mut:#5B737D;--line:#D3E0E3;--p:#0B6E7A;--pf:#fff;--soft:#E1F0F1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D22;--card:#162A31;--ink:#E4F0F2;--mut:#93AAB2;--line:#28414A;--p:#4FC3CF;--pf:#08262B;--soft:#1B3840;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1D22;--card:#162A31;--ink:#E4F0F2;--mut:#93AAB2;--line:#28414A;--p:#4FC3CF;--pf:#08262B;--soft:#1B3840;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:18px 24px 8px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}.sub{color:var(--mut);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--p)}.btn.p{background:var(--p);color:var(--pf);border-color:var(--p)}.btn.d{color:#D1344B}.btn.s{padding:4px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:0 24px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--p);border-color:var(--p)}
main{padding:20px 24px 60px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--p));border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.alert{border-left:5px solid #C98A0B;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.months{display:flex;align-items:flex-end;gap:6px;height:170px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut);cursor:pointer}
.months i{display:block;width:100%;background:var(--p);border-radius:4px 4px 0 0;min-height:2px}.months b{color:var(--ink);font-size:12px}
.row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 30px;gap:8px;align-items:center;margin:6px 0;font-size:13px;cursor:pointer}
.row .tr{background:var(--soft);border-radius:5px;height:14px}.row i{display:block;height:100%;border-radius:5px;background:var(--c,var(--p))}.row u{text-decoration:none;text-align:right;font-weight:700}

.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:22px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.lg i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.up{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}.up:first-of-type{border:0}.up em{font-style:normal;color:var(--mut);min-width:80px}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap;position:sticky;top:0}th.so{cursor:pointer}tr.rw:hover td{background:var(--soft)}
td.n{white-space:nowrap}.mut{color:var(--mut);font-size:13px}.warn{background:color-mix(in srgb,#C98A0B 22%,transparent)}

.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}.bar input[type=search]{flex:1;min-width:180px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);min-width:720px}
.cal .h{background:var(--soft);padding:6px;font-weight:600;font-size:13px;text-align:center}
.cal .d{min-height:104px;padding:4px;border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer}.cal .d:nth-child(7n+1){border-left:0}
.cal .d.o{opacity:.45}.cal .d.w{background:color-mix(in srgb,var(--soft) 55%,transparent)}.cal .d.t .num{background:var(--p);color:var(--pf)}
.num{display:inline-block;min-width:22px;text-align:center;border-radius:11px;font-size:12px;font-weight:700;margin-bottom:2px}
.chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));border-radius:4px;padding:2px 5px;margin-bottom:2px;font-size:11.5px;line-height:1.25;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:11.5px;color:var(--p);font-weight:700}
#ov{position:fixed;inset:0;background:rgba(5,20,25,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
#ov.on{display:flex}.mod{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:20px;border:1px solid var(--line)}
.mod h2{margin:0 0 14px;font-size:18px}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600}.f .w{grid-column:1/-1}
.err{color:#D1344B;font-size:13px;min-height:18px;margin-top:8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.acts .gap{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center}#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.help li{margin:6px 0}@media(max-width:560px){.f{grid-template-columns:1fr}header,main,nav{padding-left:14px;padding-right:14px}}
</style></head><body>

if(a=="tab")go(d.v);else if(a=="j")go("jr",{st:d.st||"",type:d.ty||"",q:"",miss:0});else if(a=="ge"){S.etab=d.v;go("jr")}else if(a=="cal"){S.cm=+d.m;go("cal")}
else if(a=="edit"){ev.stopPropagation();form(d.id)}else if(a=="new")form(null,d.d?{debut:d.d}:{});else if(a=="day")dayList(d.d);else if(a=="close")close();
else if(a=="pm"){S.cm+=+d.v;if(S.cm<0){S.cm=11;S.year=(S.year||NOW.getFullYear())-1}if(S.cm>11){S.cm=0;S.year=(S.year||NOW.getFullYear())+1}render()}
else if(a=="today"){S.cm=NOW.getMonth();S.year=NOW.getFullYear();render()}else if(a=="sort"){S.asc*=-1;render()}
else if(a=="fix"){const l=scope().filter(e=>end(e)<TODAY&&["Prévu","Confirmé"].includes(e.statut)),old=l.map(e=>e.statut);l.forEach(e=>e.statut="Terminé");save();render();toast(l.length+" événement(s) passé(s) en « Terminé »",()=>{l.forEach((e,i)=>e.statut=old[i]);save();render()})}
else if(a=="del"){const id=$("#fm2").dataset.id,i=S.ev.findIndex(e=>e.id==id),r=S.ev[i];S.ev.splice(i,1);save();close();render();toast("Événement supprimé",()=>{S.ev.push(r);save();render()})}
else if(a=="dup"){const e={...byId($("#fm2").dataset.id),id:Math.max(0,...S.ev.map(x=>x.id))+1};S.ev.push(e);save();render();form(e.id);toast("Copie créée : modifiez-la puis enregistrez")}
else if(a=="reset")ask("Remplacer toutes vos données par celles du fichier d’origine ?",()=>{S.ev=D.events.map((e,i)=>({...e,id:i+1}));S.et=D.etabs;save();render();toast("Données d’origine restaurées")});
else if(a=="xl")exportXl()});
document.addEventListener("change",ev=>{const t=ev.target;if(t.id=="gy"){S.year=+t.value;render()}else if(t.id=="ge"){S.etab=t.value;render()}
else if(t.dataset.a=="stat"){byId(t.dataset.id).statut=t.value;save();render()}else if(t.id=="ft"){S.type=t.value;$("#jt").innerHTML=rows()}else if(t.id=="fs"){S.st=t.value;$("#jt").innerHTML=rows()}else if(t.id=="fm"){S.miss=t.checked?1:0;$("#jt").innerHTML=rows()}
else if(t.dataset.k){S.et[t.dataset.i][t.dataset.k]=t.value;save();t.classList.remove("warn")}else if(t.id=="imp")importXl(t.files[0]);
else if(t.name=="etab"&&t.form){const x=S.et.find(z=>z.nom==t.value),f=t.form;if(x){if(!f.ref.value)f.ref.value=x.ref;if(!f.contact.value)f.contact.value=x.contact}}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.id=="q"){S.q=t.value;$("#jt").innerHTML=rows()}else if(t.id=="qe")document.querySelectorAll("#et tr").forEach(r=>r.hidden=!r.dataset.n.includes(t.value.toLowerCase()))});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id,err=m=>$("#er").textContent=m;
if(!v.etab)return err("Choisissez un établissement.");if(!v.titre.trim())return err("Saisissez un intitulé.");if(!v.debut)return err("Indiquez la date de début.");if(v.fin&&v.fin<v.debut)return err("La date de fin est avant la date de début.");
v.fin=v.fin||v.debut;if(!id&&S.ev.some(e=>e.etab==v.etab&&e.debut==v.debut&&e.titre.trim().toLowerCase()==v.titre.trim().toLowerCase()))return err("Cet événement existe déjà pour cet établissement à cette date.");
if(id)Object.assign(byId(id),v);else S.ev.push({...v,id:Math.max(0,...S.ev.map(x=>x.id))+1});
if(!S.year||+v.debut.slice(0,4)!=S.year)S.year=+v.debut.slice(0,4);S.cm=+v.debut.slice(5,7)-1;save();close();render();toast(id?"Modifications enregistrées":"Événement ajouté")});
/* ---------- Excel ---------- */
async function exportXl(){const r=S.ev.slice().sort((a,b)=>a.debut.localeCompare(b.debut)).map((e,i)=>({"N°":i+1,"Établissement":e.etab,"Type d'événement":e.type,"Intitulé de la manifestation":e.titre,"Date début":e.debut,"Date fin":end(e),"Horaires":e.horaires,"Public visé":e.public,"Lieu":e.lieu,"Référent":e.ref,"Contact":e.contact,"Statut":ico(e)+" "+e.statut,"Remarques / Besoins logistiques":e.remarques}));
try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),"Journal");const data=XLSX.write(wb,{type:"array",bookType:"xlsx"}),dl=await claude.use("downloads");
if(!dl)return toast("Téléchargement indisponible dans cette vue : ouvrez l’outil depuis son lien.");await dl.save({filename:"calendrier-evenements.xlsx",data:new Uint8Array(data)})}catch(e){if(!e||e.code!="declined")toast("Export impossible pour le moment.")}}
function importXl(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames.find(n=>/journal/i.test(n))||wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}),h=a.findIndex(r=>r.some(c=>/Intitulé/i.test(c)));if(h<0)throw 0;
const H=a[h].map(c=>String(c)),ix=re=>H.findIndex(c=>re.test(c)),C={etab:ix(/Établissement/i),type:ix(/^Type d/i),titre:ix(/Intitulé/i),debut:ix(/Date début/i),fin:ix(/Date fin/i),horaires:ix(/Horaires/i),public:ix(/Public/i),lieu:ix(/Lieu/i),ref:ix(/Référent/i),contact:ix(/Contact/i),statut:ix(/Statut/i),remarques:ix(/Remarques/i)};
const dt=v=>v instanceof Date?iso(new Date(v.getTime()+12*36e5)):typeof v=="number"?iso(new Date(Date.UTC(1899,11,30)+v*864e5+12*36e5)):/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):"",g=(r,k)=>C[k]<0?"":String(r[C[k]]??"").trim();let n=0,id=Math.max(0,...S.ev.map(x=>x.id));
a.slice(h+1).forEach(r=>{const e={etab:g(r,"etab"),type:g(r,"type")||"Autre",titre:g(r,"titre"),debut:dt(r[C.debut]),fin:dt(r[C.fin]),horaires:g(r,"horaires"),public:g(r,"public"),lieu:g(r,"lieu"),ref:g(r,"ref"),contact:g(r,"contact"),statut:g(r,"statut").replace(/^\S+\s/,"")||"Prévu",remarques:g(r,"remarques")};
if(!e.etab||!e.titre||!e.debut||S.ev.some(x=>x.etab==e.etab&&x.debut==e.debut&&x.titre==e.titre))return;if(!ST[e.statut])e.statut="Prévu";e.fin=e.fin||e.debut;e.id=++id;S.ev.push(e);n++});save();render();toast(n+" événement(s) importé(s) (les doublons sont ignorés)")}catch(e){toast("Fichier non reconnu : il faut une colonne « Intitulé de la manifestation ».")}};rd.readAsArrayBuffer(f)}
render();
</script></body></html>
