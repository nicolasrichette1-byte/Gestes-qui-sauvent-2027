<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi QHSE & SST — Plateaux techniques</title>
<style>
:root{
  --bg:#f4f7fa; --surface:#ffffff; --surface2:#eef2f7; --border:#d6dde8;
  --text:#1f2a3d; --muted:#5d6b82; --accent:#1f6fa8; --accent-soft:#e1eef8;
  --ok:#1d7f55; --ok-soft:#dff3ea; --warn:#9a6200; --warn-soft:#fdf0d5;
  --alert:#b23a48; --alert-soft:#fbe4e7; --info:#3f5fa8; --info-soft:#e4eaf8;
  --radius:12px; --shadow:0 1px 3px rgba(31,42,61,.08),0 4px 14px rgba(31,42,61,.05);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a24; --surface:#1d2634; --surface2:#263143; --border:#34425a;
    --text:#e8edf5; --muted:#9fadc4; --accent:#6bb3e6; --accent-soft:#1e3347;
    --ok:#5fd0a0; --ok-soft:#18362b; --warn:#f0c15a; --warn-soft:#3b2f12;
    --alert:#f08a97; --alert-soft:#3d1f25; --info:#9db4f0; --info-soft:#222d4a;
    --shadow:none;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* En-tête */
header.top{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px}
.top-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:1.25rem;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.save-ind{font-size:.78rem;color:var(--muted)}
.role{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface2)}
.role button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Écran de connexion par établissement */
.gate-wrap{max-width:520px;margin:36px auto;padding:0 16px}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.gate-card h2{margin:0 0 6px;font-size:1.3rem}
.gate-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:10px;margin:16px 0}
.gate-tabs button{border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.gate-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Navigation */
nav#tabs{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1000px;margin:0 auto;display:flex;overflow-x:auto;padding:0 12px;gap:2px}
.tab{border:0;background:transparent;padding:12px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.75rem;text-align:center}

main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:1.2rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1rem}
.charte{background:var(--accent-soft);border-color:transparent}
.charte ul{margin:6px 0 0;padding-left:20px}
.grid{display:grid;gap:12px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}

/* Boutons */
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.9rem;min-height:40px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 10px;min-height:32px;font-size:.82rem}
.btn.danger:hover{border-color:var(--alert);color:var(--alert)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}

/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:10px}
label.inline{display:flex;gap:8px;align-items:center;color:var(--text);font-size:.92rem;font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-weight:400;color:var(--text)}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:620px){.f2{grid-template-columns:1fr}}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-alert{background:var(--alert-soft);color:var(--alert)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-mute{background:var(--surface2);color:var(--muted)}

/* Listes */
.item{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.item.k-ok{border-left-color:var(--ok)} .item.k-warn{border-left-color:#d9992e} .item.k-alert{border-left-color:var(--alert)} .item.k-info{border-left-color:var(--info)}
.item h4{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.82rem}
.item .badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.item .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.desc{white-space:pre-wrap;margin:6px 0}
.reply{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}
.toolbar label{margin:0}
@media (max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{grid-column:1/-1}}
.note{border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.note.alert{background:var(--alert-soft);color:var(--alert)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

/* Points de contrôle */
details.theme{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
details.theme>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.theme>summary::-webkit-details-marker{display:none}
details.theme>summary small{font-weight:400;color:var(--muted);display:block}
.pt{padding:12px 16px;border-top:1px solid var(--border)}
.pt-title{margin-bottom:8px;font-size:.95rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"].s-nv{background:var(--surface2);color:var(--text);border-color:var(--muted)}
.seg button[aria-pressed="true"].s-am{background:var(--alert-soft);color:var(--alert);border-color:var(--alert)}
.seg button[aria-pressed="true"].s-ec{background:var(--warn-soft);color:var(--warn);border-color:#d9992e}
.seg button[aria-pressed="true"].s-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}

/* Dialog */
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,22,35,.55)}
.dlg{padding:20px}
.dlg h3{margin:0 0 12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2a3d;color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90%}
#toast.show{opacity:1}
footer{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.78rem;text-align:center}
footer a{color:inherit}

table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.t th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.print-head{display:none}

@media print{
  header.top,nav#tabs,footer,.noprint,#toast{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0;max-width:none}
  .card,.item{box-shadow:none;break-inside:avoid}
  .print-head{display:block;margin-bottom:12px}
  :root{--surface:#fff;--text:#000;--border:#bbb}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Suivi QHSE &amp; SST — Plateaux techniques</h1>
      <p id="brand-sub">Vice-Rectorat de la Nouvelle-Calédonie · DAFPIC</p>
    </div>
    <div class="top-right hidden" id="top-controls">
      <div class="role" role="group" aria-label="Vue">
        <button type="button" data-act="role" data-v="ens">Enseignant</button>
        <button type="button" data-act="role" data-v="ddfpt">DDFPT</button>
      </div>
      <button type="button" class="btn small" data-act="logout" title="Changer d'établissement ou verrouiller">🔒 Établissement</button>
      <span class="save-ind" id="save-ind" aria-live="polite"></span>
    </div>
  </div>
</header>
<nav id="tabs" class="hidden"><div class="tabs-in" id="tabs-in"></div></nav>
<main id="view"></main>
<footer>Outil conçu par <a href="mailto:nicolas.richette@ac-noumea.nc">Nicolas Richette</a> · Vice-Rectorat de la Nouvelle-Calédonie · Version 2.1 · Données conservées uniquement dans ce navigateur</footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ═════════════ DONNÉES DE RÉFÉRENCE ═════════════ */
const MASTER_CODE='DAFPIC2027';
const REG_KEY='suivi_qhse_sst_etabs_v1';
const LEGACY_LS_KEY='suivi_qhse_sst_v2', OLD_KEY='ddfpt_securite_v1';

const ATELIERS_BASE=[
 {id:'menuiserie',label:'Menuiserie'},{id:'maintenance',label:'Maintenance'},{id:'hotrest',label:'Hôtellerie-Restauration'},
 {id:'electricite',label:'Électricité'},{id:'froid',label:'Froid-Climatisation'},{id:'chaudronnerie',label:'Chaudronnerie / Soudage'},
 {id:'carrosserie',label:'Carrosserie'},{id:'maconnerie',label:'Maçonnerie'},{id:'plomberie',label:'Plomberie-Sanitaire'},
 {id:'auto',label:'Automobile'},{id:'informatique',label:'Informatique'},{id:'coiffure',label:'Coiffure-Esthétique'},
 {id:'commerce',label:'Commerce-Vente'}
];
const CATEGORIES=['Machine','Extincteur','Trousse de secours','Éclairage de sécurité (BAES)','Défibrillateur (DAE)','Aspiration / ventilation','Installation électrique','Outillage électroportatif','Protection collective (carters, rideaux)','Armoire produits chimiques','Autre'];
const ETATS={service:{l:'En service',c:'b-ok'},surveiller:{l:'À surveiller',c:'b-warn'},hs:{l:'Hors service',c:'b-alert'},retire:{l:'Retiré',c:'b-mute'}};
const NATURES={materiel:{l:'Matériel à réparer / remplacer',c:'b-info'},securite:{l:'Point de sécurité à corriger',c:'b-warn'},conso:{l:'Consommable ou affichage manquant',c:'b-info'},idee:{l:'Idée d\'amélioration',c:'b-ok'}};
const SIG_ST={nouveau:{l:'Reçu',c:'b-warn'},pris:{l:'Pris en compte',c:'b-info'},traite:{l:'Traité',c:'b-ok'}};
const PT_ST={nv:{l:'Pas encore vu',i:'○'},am:{l:'À améliorer',i:'!'},ec:{l:'En cours',i:'…'},ok:{l:'En place',i:'✓'}};
const ACT_ST={adem:{l:'À démarrer',c:'b-mute'},encours:{l:'En cours',c:'b-warn'},termine:{l:'Terminée',c:'b-ok'}};
const RISQUES=['','Chute de plain-pied','Chute de hauteur','Circulations internes','Risques routiers en mission','Charge physique de travail','Manutention mécanique','Produits chimiques, émissions et déchets','Agents biologiques','Équipements de travail','Effondrements et chutes d\'objet','Bruit','Ambiances thermiques','Incendie et explosion','Électricité','Ambiances lumineuses','Rayonnements','Risques psychosociaux','Autre risque'];

const THEMES=[
 {id:'m1',label:'Bâtiment, électricité & contrôles',sub:'CAFAT, APAVE/SOCOTEC, électricité, issues de secours',points:[
  ['m1_01','Visite CAFAT réalisée et préconisations relevées'],
  ['m1_02','Préconisations CAFAT : levée réalisée ou en cours'],
  ['m1_03','Contrôle APAVE/SOCOTEC planifié (date programmée)'],
  ['m1_04','Rapport de contrôle reçu, archivé et accessible'],
  ['m1_05','Réserves du rapport : levée réalisée ou en cours'],
  ['m1_06','Armoire électrique principale fermée à clé et signalée'],
  ['m1_07','Prises électriques en bon état, sans surcharge'],
  ['m1_08','Signalisation de sécurité visible (sorties, extincteurs)'],
  ['m1_09','Issues de secours dégagées et déverrouillées pendant les cours'],
  ['m1_10','Éclairage général et de sécurité fonctionnel']]},
 {id:'m2',label:'Machines, protections & affichages',sub:'Registre machines, aspiration, carters, BAES',points:[
  ['m2_01','Registre de maintenance tenu à jour pour chaque machine'],
  ['m2_02','Fiche d\'identité machine (marque, n° de série, mise en service)'],
  ['m2_03','Plan de renouvellement des équipements formalisé'],
  ['m2_04','Affichages réglementaires présents près des machines'],
  ['m2_05','Affiches de port des EPI visibles et à jour'],
  ['m2_06','Aspiration centralisée fonctionnelle, filtres vérifiés'],
  ['m2_07','Mesures de poussières réalisées si nécessaire'],
  ['m2_08','Carters et rideaux de protection en place'],
  ['m2_09','Blocs de sécurité (BAES) testés et fonctionnels'],
  ['m2_10','Registre de contrôle BAES tenu à jour']]},
 {id:'m3',label:'Produits chimiques & déchets',sub:'Inventaire, FDS, stockage, filières de déchets',points:[
  ['m3_01','Inventaire des produits chimiques à jour'],
  ['m3_02','Stockage conforme (armoire ventilée, séparation des produits)'],
  ['m3_03','Pictogrammes de danger présents sur les contenants'],
  ['m3_04','Dates de péremption vérifiées, produits périmés évacués'],
  ['m3_05','Fiches de données de sécurité (FDS) disponibles et à jour'],
  ['m3_06','Équipe informée de la consultation des FDS'],
  ['m3_07','Filière de collecte des huiles usagées identifiée'],
  ['m3_08','Filière de collecte des batteries identifiée'],
  ['m3_09','Filière de collecte des solvants / peintures identifiée'],
  ['m3_10','Bordereaux de suivi des déchets (BSD) archivés']]},
 {id:'m4',label:'Secours, circulation & rangement',sub:'Trousses, extincteurs, DAE, marquage, outillage',points:[
  ['m4_01','Trousses de secours complètes et non périmées'],
  ['m4_02','Vérification mensuelle des trousses (registre signé)'],
  ['m4_03','Extincteurs vérifiés dans les délais'],
  ['m4_04','Défibrillateur (DAE) accessible, signalé, opérationnel'],
  ['m4_05','Marquage au sol des circulations lisible'],
  ['m4_06','Accès aux issues de secours entièrement dégagés'],
  ['m4_07','Zones de stockage délimitées et respectées'],
  ['m4_08','Stock de réserve rangé et organisé'],
  ['m4_09','Outillage manuel en bon état (manches, affûtage)'],
  ['m4_10','Outillage électroportatif en bon état (câbles, interrupteurs, protections)']]},
 {id:'m5',label:'Formations & habilitations',sub:'Passeport sécurité, SST, habilitations, CACES, AMD',points:[
  ['m5_01','Passeport Sécurité des élèves : suivi à jour'],
  ['m5_02','SST des élèves : liste des certifiés tenue'],
  ['m5_03','Recyclage SST du personnel : dates de validité suivies'],
  ['m5_04','Habilitations électriques : liste, niveaux, validité'],
  ['m5_05','Autorisations internes de conduite à jour'],
  ['m5_06','CACES valides et archivés'],
  ['m5_07','Interventions de l\'AMD planifiées pour l\'année'],
  ['m5_08','Interventions de l\'AMD réalisées, comptes rendus archivés'],
  ['m5_09','Préconisations de l\'AMD : plan d\'actions formalisé']]}
];
const ALL_POINTS={}; THEMES.forEach(t=>t.points.forEach(([id,title])=>ALL_POINTS[id]={id,title,theme:t.id}));

/* ═════════════ GESTION MULTI-ÉTABLISSEMENTS & CODES ═════════════ */
let memOnly=false;
let registry=[]; // [{id, name, code, created}]
let currentEtabId=null;
let unlockedByMaster=false;
let gateMode='login'; // 'login' | 'create'
let state={v:2,etab:'',role:'ens',ateliers:[],customAteliers:[],points:{},equipements:[],signalements:[],actions:[],lastBackup:null};
const ui={tab:'home',eqSearch:'',eqAtelier:'',eqFilter:'',sigFilter:'open',actFilter:'open',openThemes:new Set(),openDetails:new Set(),prefill:null};

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const fmt=iso=>{if(!iso)return '—';const [y,m,d]=iso.slice(0,10).split('-');return `${d}/${m}/${y}`};
const addMonths=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1+n,d);if(dt.getDate()!==d)dt.setDate(0);return isoOf(dt)};
const diffDays=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const money=v=>{const n=parseInt(String(v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n};
const fmtMoney=n=>n.toLocaleString('fr-FR')+' FCFP';
const slug=s=>(s||'etablissement').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,30)||'etablissement';

const etabStorageKey=id=>`${LEGACY_LS_KEY}_${id}`;

function loadRegistry(){
  try{
    const raw=localStorage.getItem(REG_KEY);
    if(raw)registry=JSON.parse(raw)||[];
  }catch(e){memOnly=true}
}
function saveRegistry(){
  if(memOnly)return;
  try{localStorage.setItem(REG_KEY,JSON.stringify(registry))}catch(e){memOnly=true}
}
function currentEtabEntry(){
  return registry.find(x=>x.id===currentEtabId)||null;
}

function allAteliers(){return ATELIERS_BASE.concat(state.customAteliers)}
function activeAteliers(){
  const all=allAteliers();
  const sel=state.ateliers.length?all.filter(a=>state.ateliers.includes(a.id)):ATELIERS_BASE;
  return sel.concat([{id:'general',label:'Général / tous ateliers'}]);
}
function atelierLabel(id){const a=allAteliers().concat([{id:'general',label:'Général / tous ateliers'}]).find(x=>x.id===id);return a?a.label:(id||'—')}

function save(){
  if(!currentEtabId)return;
  state.updated=nowISO();
  if(!memOnly){
    try{localStorage.setItem(etabStorageKey(currentEtabId),JSON.stringify(state))}
    catch(e){memOnly=true;toast('⚠️ Stockage du navigateur indisponible : exportez régulièrement une sauvegarde.')}
  }
  const ind=$('#save-ind');
  if(ind){
    const t=new Date();
    ind.textContent=memOnly?'⚠️ Non enregistré':`✓ ${pad(t.getHours())}:${pad(t.getMinutes())}`;
  }
}

function loadEtabState(etabEntry){
  currentEtabId=etabEntry.id;
  state={v:2,etab:etabEntry.name,role:'ens',ateliers:[],customAteliers:[],points:{},equipements:[],signalements:[],actions:[],lastBackup:null};
  let raw=null;
  try{raw=localStorage.getItem(etabStorageKey(etabEntry.id))}catch(e){memOnly=true}
  if(raw){
    try{
      const o=JSON.parse(raw);
      Object.assign(state,o);
      state.etab=etabEntry.name;
    }catch(e){console.warn(e)}
    return;
  }
  // Migration automatique d'éventuelles données antérieures non cloisonnées
  try{
    const legacy=localStorage.getItem(LEGACY_LS_KEY);
    if(legacy){
      const o=JSON.parse(legacy);
      Object.assign(state,o);
      state.etab=etabEntry.name;
      localStorage.removeItem(LEGACY_LS_KEY);
      save();
      return;
    }
    const old=localStorage.getItem(OLD_KEY);
    if(old){
      const conv=convertOld(JSON.parse(old));
      if(conv){
        mergeInto(conv);
        state.etab=etabEntry.name;
        save();
        setTimeout(()=>toast('Anciennes données reprises automatiquement'),600);
      }
    }
  }catch(e){}
}

function download(name,text,mime){
  const blob=new Blob([text],{type:mime});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function copyText(txt){
  const done=()=>toast('Texte copié — collez-le dans un e-mail ou un message');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copie impossible')}ta.remove()}
}

function convertOld(o){
  if(!o||typeof o!=='object'||!('evaluations' in o))return null;
  const map={non_evalue:'nv',non_conforme:'am',en_cours:'ec',conforme:'ok'};
  const avMap={non_conforme:'adem',en_cours:'encours',conforme:'termine'};
  const out={points:{},signalements:[],actions:[],ateliers:o.ateliers||[],customAteliers:o.customAteliers||[],etab:(o.userName||'').split('—')[1]?.trim()||''};
  const ts=nowISO();
  Object.entries(o.evaluations||{}).forEach(([id,ev])=>{
    if(!ALL_POINTS[id])return;
    const s=map[ev.status]||'nv';
    out.points[id]={s,note:ev.plan||'',resp:ev.responsable||'',ech:ev.echeance||'',maj:ts};
    if(s==='am'||s==='ec'){
      out.actions.push({id:'old_'+id,pid:id,titre:ALL_POINTS[id].title,risque:'',desc:ev.plan||'',resp:ev.responsable||'',budget:ev.budget||'',annee:ev.annee||'',ech:ev.echeance||'',av:s==='ec'?'encours':'adem',maj:ts});
    }
  });
  (o.manualActions||[]).forEach(m=>out.actions.push({id:'old_'+m.id,pid:'',titre:m.titre||'',risque:'',desc:m.plan||'',resp:m.responsable||'',budget:m.budget||'',annee:m.annee||'',ech:m.echeance||'',av:avMap[m.avancement]||'adem',maj:ts}));
  (o.tickets||[]).forEach(t=>{
    const parts=(t.date||'').split('/');const d=parts.length===3?`${parts[2]}-${parts[1]}-${parts[0]}`:today();
    const at=ATELIERS_BASE.find(a=>a.label.toLowerCase().startsWith((t.atelier||'').toLowerCase().slice(0,6)));
    out.signalements.push({id:'old_'+t.id,date:d,atelier:at?at.id:'general',equipId:'',cat:t.type==='urgence'?'securite':t.type==='info'?'idee':'materiel',urgent:t.type==='urgence',desc:t.desc||'',auteur:'',statut:t.resolved?'traite':'nouveau',reponse:'',maj:ts});
  });
  return out;
}
function newer(a,b){return (a.maj||'')>=(b.maj||'')}
function mergeInto(inc){
  let added=0,updated=0;
  ['equipements','signalements','actions'].forEach(k=>{
    (inc[k]||[]).forEach(x=>{
      if(!x||!x.id)return;
      const i=state[k].findIndex(y=>y.id===x.id);
      if(i<0){state[k].push(x);added++}
      else if(!newer(state[k][i],x)){state[k][i]=x;updated++}
    });
  });
  Object.entries(inc.points||{}).forEach(([id,p])=>{
    if(!ALL_POINTS[id])return;
    const cur=state.points[id];
    if(!cur||!newer(cur,p)){state.points[id]=p;cur?updated++:added++}
  });
  (inc.ateliers||[]).forEach(a=>{if(!state.ateliers.includes(a))state.ateliers.push(a)});
  (inc.customAteliers||[]).forEach(a=>{if(!state.customAteliers.find(x=>x.id===a.id))state.customAteliers.push(a)});
  return {added,updated};
}
function readJSONFile(file,cb){
  const r=new FileReader();
  r.onload=e=>{try{cb(JSON.parse(e.target.result))}catch(err){toast('⚠️ Fichier illisible')}};
  r.readAsText(file);
}
function doMerge(file){
  readJSONFile(file,o=>{
    const inc=convertOld(o)||o;
    if(!inc||typeof inc!=='object'||!(inc.signalements||inc.equipements||inc.points||inc.actions)){toast('⚠️ Ce fichier ne ressemble pas à une sauvegarde de cet outil');return}
    const r=mergeInto(inc);save();render();
    toast(`Fusion terminée : ${r.added} élément(s) ajouté(s), ${r.updated} mis à jour`);
  });
}
function doRestore(file){
  readJSONFile(file,o=>{
    const inc=convertOld(o)||o;
    if(!inc||typeof inc!=='object'||!(inc.signalements||inc.equipements||inc.points||inc.actions)){toast('⚠️ Ce fichier ne ressemble pas à une sauvegarde de cet outil');return}
    if(!confirm('Restaurer cette sauvegarde REMPLACE toutes les données de cet établissement. Continuer ?'))return;
    const keepRole=state.role,keepEtab=state.etab;
    state={v:2,etab:keepEtab,role:keepRole,ateliers:[],customAteliers:[],points:{},equipements:[],signalements:[],actions:[],lastBackup:null};
    mergeInto(inc);save();render();toast('Sauvegarde restaurée');
  });
}

  state.lastBackup=nowISO();save();

function dueInfo(e){
  if(e.etat==='retire'||!e.period)return {k:'none',label:'Pas de périodicité définie'};
  if(!e.derniere)return {k:'never',label:'Jamais vérifié'};
  const next=addMonths(e.derniere,e.period),d=diffDays(today(),next);
  if(d<0)return {k:'late',next,d,label:`À revérifier (échéance dépassée de ${-d} j)`};
  if(d<=30)return {k:'soon',next,d,label:`À vérifier avant le ${fmt(next)}`};
  return {k:'ok',next,d,label:`Prochaine vérification : ${fmt(next)}`};
}
const needsCheck=e=>['never','late','soon'].includes(dueInfo(e).k);

    <div class="meta">${esc(e.cat)} · ${esc(atelierLabel(e.atelier))}${e.repere?' · Repère : '+esc(e.repere):''}</div>
    <div class="badges">${dBadge}${e.derniere?`<span class="badge b-mute">Dernière vérif. : ${fmt(e.derniere)}</span>`:''}</div>

/* ═════════════ POINTS DE CONTRÔLE ═════════════ */
function ensureAction(pid,status){
  let a=state.actions.find(x=>x.pid===pid);
  if(!a){
    const p=state.points[pid]||{};
    state.actions.push({id:uid(),pid,titre:ALL_POINTS[pid].title,risque:'',desc:p.note||'',resp:p.resp||'',budget:'',annee:String(new Date().getFullYear()),ech:p.ech||'',av:status==='ec'?'encours':'adem',maj:nowISO()});
  }else if(a.av==='termine'){a.av=status==='ec'?'encours':'adem';a.maj=nowISO()}
  else if(status==='ec'&&a.av==='adem'){a.av='encours';a.maj=nowISO()}
}
function setPoint(id,patch){
  const cur=state.points[id]||{s:'nv',note:'',resp:'',ech:''};
  state.points[id]={...cur,...patch,maj:nowISO()};
  if(patch.s==='am'||patch.s==='ec')ensureAction(id,patch.s);
  if(patch.s==='ok'){state.actions.filter(a=>a.pid===id&&a.av!=='termine').forEach(a=>{a.av='termine';a.maj=nowISO()})}
  save();
}
function themeStats(t){
  let seen=0,am=0,ec=0,ok=0;
  t.points.forEach(([id])=>{const s=(state.points[id]||{}).s||'nv';if(s!=='nv')seen++;if(s==='am')am++;if(s==='ec')ec++;if(s==='ok')ok++});
  return {seen,am,ec,ok,total:t.points.length};
}
function viewControles(){
  return `<h2>Points de contrôle</h2>
  <p class="lead">Une grille pour faire le tour de l'atelier, thème par thème. Rien n'est noté : on repère simplement ce qui est en place et ce qu'on peut améliorer. Un point « à améliorer » alimente automatiquement le plan d'actions.</p>
  <div class="note info noprint">La grille concerne l'établissement. Si un point ne concerne qu'un atelier, précisez-le dans l'observation.</div>`+

    return `<details class="theme" data-theme="${t.id}" ${open}>
      <summary><span>${esc(t.label)}<small>${esc(t.sub)}</small></span><span class="badge ${s.ok===s.total?'b-ok':'b-mute'}">${s.ok}/${s.total} en place</span></summary>
      ${t.points.map(([id,title])=>{

  download(`${name}_${slug(state.etab)}_${today()}.csv`,csv(rows),'text/csv;charset=utf-8');
}

/* ═════════════ DIALOGUE ═════════════ */
function openDlg(title,body,onSubmit){
  const dlg=$('#dlg');
  dlg.innerHTML=`<form class="dlg" method="dialog"><h3>${esc(title)}</h3>${body}<div class="dlg-actions"><button type="button" class="btn" data-act="dlg-close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>`;
  const f=$('form',dlg);
  f.onsubmit=ev=>{
    ev.preventDefault();
    const d=Object.fromEntries(new FormData(f).entries());
    if(onSubmit(d)===false)return;
    dlg.close();
  };
  dlg.showModal();
}

  if(!tabs.find(t=>t[0]===ui.tab))ui.tab='home';
  document.querySelectorAll('.role button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state.role)));
  $('#brand-sub').textContent=(state.etab?state.etab+' · ':'')+'Vice-Rectorat de la Nouvelle-Calédonie · DAFPIC';
  const newS=state.signalements.filter(s=>s.statut==='nouveau').length;
  $('#tabs-in').innerHTML=tabs.map(([id,l])=>`<button class="tab" data-act="go" data-tab="${id}" ${ui.tab===id?'aria-current="page"':''}>${l}${id==='signal'&&newS?`<span class="n">${newS}</span>`:''}</button>`).join('');
  const y=window.scrollY;
  const v={home:viewHome,equip:viewEquip,signal:viewSignal,controles:viewControles,plan:viewPlan,synthese:viewSynthese,params:viewParams}[ui.tab];
  $('#view').innerHTML=v();
  if(ui.tab==='equip')renderEquipList();
  if(ui.tab==='signal')fillSigEquip();
  window.scrollTo(0,y);
}

/* ═════════════ ÉVÉNEMENTS ═════════════ */
function pickFile(handler){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.onchange=()=>{if(i.files&&i.files[0])handler(i.files[0])};i.click();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A')e.preventDefault();
  switch(a){
    case 'gate-mode':
      gateMode=el.dataset.v;
      renderGate();
      break;
    case 'logout':
      currentEtabId=null;
      unlockedByMaster=false;
      ui.tab='home';
      render();
      break;
    case 'role':state.role=el.dataset.v;save();render();break;
    case 'go':
      ui.tab=el.dataset.tab;
      if(el.dataset.tab==='equip'){ui.eqFilter=el.dataset.f||'';ui.eqSearch='';ui.eqAtelier=''}
      render();window.scrollTo(0,0);break;
    case 'dlg-close':$('#dlg').close();break;
    case 'eq-add':editEquip(null);break;
    case 'eq-edit':editEquip(id);break;
    case 'eq-verif':{const x=state.equipements.find(q=>q.id===id);if(x){x.derniere=today();x.maj=nowISO();(x.hist=x.hist||[]).push({d:today(),t:'Vérification effectuée'});save();render();toast('Vérification enregistrée')}break}
    case 'eq-sig':{const x=state.equipements.find(q=>q.id===id);if(x){ui.prefill={atelier:x.atelier};ui._eqPre=x.id;ui.tab='signal';render();window.scrollTo(0,0)}break}
    case 'eq-del':if(confirm('Supprimer cet équipement ?')){state.equipements=state.equipements.filter(q=>q.id!==id);save();render()}break;
    case 'sg-copy':{const s=state.signalements.find(q=>q.id===id);if(s)copyText(sigText(s));break}
    case 'sg-del':if(confirm('Supprimer ce signalement ?')){state.signalements=state.signalements.filter(q=>q.id!==id);save();render()}break;
    case 'sg-reply':replyDialog(id);break;
    case 'sg-export':exportSignalements();break;
    case 'sg-mail':{
      const open=state.signalements.filter(s=>s.statut!=='traite');
      if(!open.length){toast('Aucun signalement en cours à envoyer');break}
      const body=open.map(sigText).join('\n\n———\n\n');
      const href='mailto:?subject='+encodeURIComponent(`Signalement(s) (${state.etab}) — plateaux techniques`)+'&body='+encodeURIComponent(body.slice(0,1500));
      if(body.length>1500)copyText(body);
      location.href=href;break}
    case 'pt-st':{
      const cur=(state.points[id]||{}).s;
      const v=el.dataset.v;
      ui.openThemes=new Set([...document.querySelectorAll('details.theme[open]')].map(d=>d.dataset.theme));
      ui.openDetails=new Set([...document.querySelectorAll('details.more[open]')].map(d=>d.dataset.det));
      setPoint(id,{s:cur===v?'nv':v});render();
      if(['am','ec'].includes(v)&&cur!==v)toast('Ajouté au plan d\'actions');
      break}
    case 'ac-add':editAction(null);break;
    case 'ac-edit':editAction(id);break;
    case 'ac-done':{const x=state.actions.find(q=>q.id===id);if(x){x.av='termine';x.maj=nowISO();save();render()}break}
    case 'ac-del':if(confirm('Supprimer cette action ?')){state.actions=state.actions.filter(q=>q.id!==id);save();render()}break;
    case 'print':window.print();break;
    case 'csv':exportCSV(el.dataset.v);break;
    case 'add-atelier':{
      const inp=$('#new-atelier'),v=inp.value.trim();if(!v)break;
      const aid='c_'+slug(v).toLowerCase();
      if(!allAteliers().find(x=>x.id===aid)){state.customAteliers.push({id:aid,label:v});state.ateliers.push(aid);save();render()}
      break}
    case 'backup':exportBackup();break;
    case 'pick-merge':pickFile(doMerge);break;
    case 'pick-restore':pickFile(doRestore);break;
    case 'reset':
      if(confirm('Effacer TOUTES les données de cet établissement ? Pensez à télécharger une sauvegarde avant.')&&confirm('Dernière confirmation : cette action est définitive.')){
        state={v:2,etab:state.etab,role:state.role,ateliers:[],customAteliers:[],points:{},equipements:[],signalements:[],actions:[],lastBackup:null};save();render();toast('Données effacées')}
      break;
    case 'delete-etab':
      if(confirm(`Supprimer définitivement l'établissement « ${state.etab} » et toutes ses données de ce navigateur ?`)){
        try{localStorage.removeItem(etabStorageKey(currentEtabId))}catch(err){}
        registry=registry.filter(x=>x.id!==currentEtabId);
        saveRegistry();
        currentEtabId=null;
        unlockedByMaster=false;
        render();
        toast('Établissement supprimé');
      }
      break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='sg-atelier'){fillSigEquip();return}
  if(el.id==='sg-urgent'){$('#urgent-note').classList.toggle('hidden',!el.checked);return}
  if(el.id==='eq-at'){ui.eqAtelier=el.value;renderEquipList();return}
  if(el.id==='eq-fl'){ui.eqFilter=el.value;renderEquipList();return}
  if(el.id==='sg-filter'){ui.sigFilter=el.value;render();return}
  if(el.id==='ac-filter'){ui.actFilter=el.value;render();return}
  const c=el.dataset.chg,id=el.dataset.id;if(!c)return;
  if(c==='pt-note')setPoint(id,{note:el.value.trim()});
  if(c==='pt-resp')setPoint(id,{resp:el.value.trim()});
  if(c==='pt-ech')setPoint(id,{ech:el.value});
  if(c==='etab'){
    const v=el.value.trim();
    if(!v)return;
    state.etab=v;
    const entry=currentEtabEntry();
    if(entry){entry.name=v;saveRegistry()}
    save();render();
  }
  if(c==='etab-code'){
    const v=el.value.trim();
    if(v.length<4){toast('Le code doit contenir au moins 4 caractères');return}
    const entry=currentEtabEntry();
    if(entry){entry.code=v;saveRegistry();toast('Code de l\'établissement mis à jour')}
  }
  if(c==='atelier-toggle'){
    state.ateliers=el.checked?[...new Set([...state.ateliers,id])]:state.ateliers.filter(x=>x!==id);save();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='eq-q'){ui.eqSearch=e.target.value;renderEquipList()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='gate-login-form'){
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target).entries());
    const entry=registry.find(x=>x.id===d.etabId);
    if(!entry){toast('Établissement introuvable');return}
    const inputCode=(d.code||'').trim();
    const isMaster=inputCode.toUpperCase()===MASTER_CODE;
    if(inputCode!==entry.code && !isMaster){
      toast('❌ Code incorrect (utilisez le code de l\'établissement ou le code de secours DAFPIC2027)');
      return;
    }
    unlockedByMaster=isMaster;
    loadEtabState(entry);
    if(isMaster){
      state.role='ddfpt';
      toast(`Accès débloqué via le code de secours (${entry.name})`);
    }else{
      toast(`Bienvenue — ${entry.name}`);
    }
    render();
    save();
    return;
  }
  if(e.target.id==='gate-create-form'){
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target).entries());
    const name=(d.name||'').trim();
    const code=(d.code||'').trim();
    if(!name||code.length<4){toast('Renseignez le nom et un code d\'au moins 4 caractères');return}
    if(registry.find(x=>x.name.toLowerCase()===name.toLowerCase())){
      toast('Cet établissement existe déjà dans la liste');
      return;
    }
    const entry={id:'etab_'+uid(),name,code,created:nowISO()};
    registry.push(entry);
    saveRegistry();
    unlockedByMaster=false;
    loadEtabState(entry);
    state.role='ddfpt';
    save();
    render();
    toast(`Établissement « ${name} » créé`);
    return;
  }
  if(e.target.id!=='sg-form')return;
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target).entries());
  if(!d.desc.trim()){toast('Décrivez le problème');return}
  state.signalements.unshift({id:uid(),date:today(),atelier:d.atelier,equipId:d.equipId||'',cat:d.cat,urgent:!!d.urgent,desc:d.desc.trim(),auteur:(d.auteur||'').trim(),statut:'nouveau',reponse:'',maj:nowISO()});
  save();ui.sigFilter='open';render();
  toast(d.urgent?'Enregistré — pensez à prévenir directement le DDFPT':'Signalement enregistré');
});

/* ═════════════ DÉMARRAGE ═════════════ */
loadRegistry();
render();
</script>
